html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);

body{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
#app{padding:14px 14px 90px}
h1,h2,h3{margin:0 0 8px;font-weight:800;}
.scr{animation:fade .35s ease}

.title-wrap{text-align:center;padding:40px 10px 20px}
.logo{font-size:44px;line-height:1;font-weight:900;color:var(--red);

.logo small{display:block;font-size:15px;color:var(--amber);margin-top:8px;font-weight:700}
.tag{color:var(--dim);font-size:13px;margin:16px 6px;line-height:1.6}
.btn{display:block;width:100%;padding:15px;margin:9px 0;border:1px solid var(--line);
  background:linear-gradient(180deg,#1c1013,#140b0e);color:var(--ink);border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--red),var(--red2));border-color:#ff5e6e;
  color:#fff;box-shadow:0 0 16px rgba(255,43,61,.4)}
.btn.ghost{background:transparent}
.btn.sm{padding:10px;font-size:14px;margin:6px 0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.choices .btn{text-align:left;position:relative;padding-right:60px}
.pct{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800;
  color:var(--amber)}
.pct.hi{color:var(--green)} .pct.lo{color:var(--red)}
.cost{font-size:12px;color:var(--dim);font-weight:500;margin-top:3px}
.hud{position:sticky;top:0;z-index:40;background:rgba(10,6,7,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:-14px -14px 12px;padding:10px 14px}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}
.clock{font-weight:800;font-size:16px}
.night-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}
.nb-calm{background:#1a2a1e;color:var(--green)} .nb-hell{background:#2a0e12;color:var(--red);

.road-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--red2),var(--red));

.road-km{position:absolute;right:6px;top:-1px;font-size:10px;color:#fff;font-weight:800;
  text-shadow:0 0 3px #000}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{flex:1 1 auto;font-size:12px;display:flex;align-items:center;gap:3px;min-width:52px}
.bar{flex:1;height:6px;background:#241317;border-radius:4px;overflow:hidden;min-width:30px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}
.loc{font-size:12px;color:var(--amber);font-weight:700;}
.story{font-size:15.5px;line-height:1.7;margin:10px 0;white-space:pre-wrap}
.flash{animation:flash .5s}

.narr{color:var(--dim);font-size:13.5px;line-height:1.65;margin:8px 0;

.badge-n{position:absolute;top:5px;margin-left:16px;background:var(--red);color:#fff;font-size:9px;

.big-end{text-align:center;padding:24px 10px}

.big-end .ecat{font-size:12px;color:var(--amber);}
.scrim-red{position:fixed;inset:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 80px 20px rgba(255,0,20,0);
  transition:box-shadow .6s}
.timer-bar{height:4px;background:#241317;border-radius:3px;overflow:hidden;margin:8px 0}
.timer-bar>i{display:block;height:100%;background:var(--red);width:100%;transition:width .1s linear}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.center{text-align:center}
.small{font-size:12px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #1a1114}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.glitch{animation:glitch .25s infinite}
@keyframes glitch{0%{transform:none;filter:none}50%{transform:translateX(1px);filter:hue-rotate(20deg)}}
.radio{background:#0e1420;border:1px solid #1a2436;border-radius:10px;padding:9px 12px;font-size:12.5px;

.tv{background:#1a0a0e;border:1px solid var(--red2);border-radius:10px;padding:9px 12px;font-size:12.5px;

.btn,.chip,.stat,.kv,.small,.loc{line-height:1.5}
.btn{font-family:inherit}

function migrateMeta(m){
 if(!m) return META_DEF();
 const d=META_DEF(); for(const k in d) if(m[k]===undefined) m[k]=d[k];
 if(m.v!==VER){ const ne={};
  for(const key in m.endings){ if(key.includes(":")){ne[key]=m.endings[key];continue;}
   const [cat,title]=key.split("|"); const i=(OLD_TITLES[cat]||[]).indexOf(title); if(i>=0) ne[cat+":"+i]={first:(m.endings[key]&&m.endings[key].first)||Date.now()}; }
  m.endings=ne; m.v=VER; }
 return m;
}

//========================= MAP =========================
function genMap(km,startPlace){
 const L=clamp(Math.round(km/10),3,12), nodes=[], edges=[], layers=[];
 const pool=PKEYS.filter(k=>k!=="drain");
 for(let l=0;l<=L;l++){
  const n=(l===0||l===L)?1:ri(2,4), arr=[];
  for(let i=0;i<n;i++){ const id=nodes.length;
   let p=l===0?startPlace:l===L?"home":pick(pool);
   if(l>0&&l<L&&chance(.05)) p="drain";
   if(l===L-1&&["rich","police"].includes(p)) p=pick(["village","shophouse","flat","street","slum"]);
   nodes.push({id,l,x:clamp((i+1)/(n+1)+rnd(-.05,.05),.08,.92),p,loot:100,boat:p==="pier"&&chance(.75)}); arr.push(id); }
  layers.push(arr);
 }
 const kmF=km/L, has=(a,b)=>edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));
 const add=(a,b,t,k)=>{ if(a===b||has(a,b))return; const T=ETYPES[t]; edges.push({a,b,t,km:Math.max(1,Math.round((k||kmF)*(T.short||1)*rnd(.9,1.1))),blocked:false}); };
 const near=(a,arr)=>arr.slice().sort((p,q)=>Math.abs(nodes[p].x-nodes[a].x)-Math.abs(nodes[q].x-nodes[a].x));
 for(let l=0;l<L;l++){ const A=layers[l],B=layers[l+1];
  A.forEach(a=>{ const nb=near(a,B); add(a,nb[0],chance(.6)?"road":"soi");
   if(nb[1]!=null&&chance(.6)){ const na=nodes[a]; let t=pick(["road","soi","hwy","hwy","rail","sewer"]);
    if(na.p==="pier") t="canal"; else if(na.p==="drain") t="sewer"; else if(na.p==="station") t="rail"; else if(na.p==="highway") t="hwy";
    add(a,nb[1],t); }
   if(nodes[a].p==="pier"&&nb.length===1){ /* single target: canal parallel not possible */ }
  });
  B.forEach(b=>{ if(!edges.some(e=>e.b===b&&nodes[e.a].l===l)) add(near(b,A)[0],b,"road"); });
  if(A.length>1) for(let i=0;i<A.length-1;i++) if(chance(.45)) add(A[i],A[i+1],"soi",rnd(2,4));
 }
 return {L,nodes,edges,km};
}
const adj=id=>G.map.edges.filter(e=>e.a===id||e.b===id).map(e=>({e,to:e.a===id?e.b:e.a}));
function bfs(from,to){ const prev={[from]:-1},q=[from]; while(q.length){ const c=q.shift(); if(c===to)break; adj(c).forEach(x=>{ if(!(x.to in prev)){prev[x.to]=c;q.push(x.to);} }); }
 if(!(to in prev)) return null; const path=[]; let c=to; while(c!==-1){path.unshift(c);c=prev[c];} return path; }
const kmLeft=id=>{ const n=node(id); return Math.round(G.map.km*(G.map.L-n.l)/G.map.L); };
function travelInfo(x){ // x:{e,to}
 const e=x.e, T=ETYPES[e.t], V=VEHS[G.veh], n=node(x.to), cur=node();
 let veh=G.veh, note="", ok=true, drop=false;
 if(T.motorOnly&&!V.motor){ ok=false; note="ต้องมีรถ"; }
 if(T.boat){ if(!cur.boat){ ok=false; note="ไม่มีเรือ"; } else { veh="เรือหางยาว"; if(V.motor||G.veh==="ซาเล้ง"){ drop=true; note="ต้องทิ้ง"+G.veh; } } }
 if(T.footOnly&&!(G.veh==="เดินเท้า"||(e.t==="rail"&&G.veh==="จักรยาน"))){ drop=true; veh="เดินเท้า"; note="ต้องทิ้ง"+G.veh; }
 const VV=VEHS[veh]; let sp=VV.sp;
 if(VV.motor){ sp*=(T.spd||1); sp*=1+sk("drive")*.06; if(G.rule.rain)sp*=.85; }
 else if(veh==="เดินเท้า"){ sp*=(G.legHurt?.7:1)*(G.age>=56?.9:1)*(1+sk("run")*.04)*(G.stamina<20?.8:1); }
 let min=e.km/sp*60, fuel=VV.fuel?e.km*VV.fuel:0, runOut=false;
 if(fuel>G.fuel+.01){ runOut=true; const frac=G.fuel/fuel; min=min*frac+(e.km*(1-frac))/5*60; fuel=G.fuel; }
 const known=G.known[x.to]||{};
 return {e,to:x.to,n,ok,note,drop,veh,min:Math.round(min),fuel,runOut,fwd:n.l-cur.l,gang:known.gang&&G.min-known.at<150?known.gang:null,fire:!!n.fire};
}

function passTime(min){
 G.min+=min; G.acc=(G.acc||0)+min;
 while(G.acc>=30){ G.acc-=30; worldStep(); }
}
function worldStep(){
 const ph=phase().k;
 // wounds
 if(G.bleed>0){ G.hp-=G.bleed; addLog(`เลือดไหล -${G.bleed}`,"bad"); if(chance(.07)&&!G.infection){G.infection=2;addLog("แผลเริ่มบวมแดง ร้อนผ่าว","bad");} G.trail=Math.min(6,(G.trail||0)+1); }
 else G.trail=Math.max(0,(G.trail||0)-1);
 if(G.infection>0){ G.hp-=G.infection; if(chance(.25))addLog("ไข้ขึ้นจากแผลติดเชื้อ","bad"); }
 if(G.drugAddict>0&&!G.flags.adrenaline&&chance(.35)){ G.sanity-=4; G.stamina-=6; addLog("ลงแดง มือสั่น เหงื่อแตก","bad"); }
 if(G.flags.adrenaline){ G.flags.adrenaline--; if(!G.flags.adrenaline){ G.stamina=Math.max(0,G.stamina-30); addLog("ยาหมดฤทธิ์ ร่างกายทวงคืนทุกอย่าง","bad"); } }
 G.noise=Math.max(0,G.noise-1);
 G.phoneBat=clamp(G.phoneBat-1.1,0,100);
 // home threat
 G.threat=clamp(G.threat+({early:1.2,deep:2.4,hell:4,dawn:1.6})[ph]*(G.flags.wHidden?.7:1)*(G.rule.moreGangs?1.2:1),0,100);
 // gangs
 G.gangs.forEach(g=>{ if(chance(.3)){ const a=adj(g.at).filter(x=>node(x.to).l>0&&node(x.to).p!=="home"); if(a.length){ let t=pick(a).to;
   if(G.noise>=6){ const p=bfs(g.at,G.at); if(p&&p.length<=3&&p.length>1) t=p[1]; } if(node(t).p!=="home") g.at=t; } } });
 // fire
 if(ph!=="early"&&chance(.06)){ const c=G.map.nodes.filter(n=>n.l>0&&n.p!=="home"&&!n.fire&&n.id!==G.at); if(c.length){ const n=pick(c); n.fire=6; } }

 const way={road:"",soi:" • ซอยเล็ก เงียบ",hwy:" • ทางหลวง เร็วแต่เสียงดัง",canal:" • นั่งเรือ",rail:" • เดินตามรางรถไฟ เงียบ",sewer:" • มุดท่อ เงียบมากแต่หลอน"}[o.e.t];
 let sub=(dark?"":`ใช้ ${o.min} นาที • `)+dangerWord(o)+way;
 if(o.note) sub+=` • ⚠️ ${o.note}`; if(o.runOut) sub+=" • ⚠️ น้ำมันไม่พอ ต้องทิ้งรถกลางทาง";
 const dir=o.fwd>0?"➡️ ไป":o.fwd<0?"↩︎ ถอยกลับไป":"↔︎ อ้อมไป";
 return {l:`${dir}${pl.n} ${pl.ic}`,sub,dis:!o.ok,primary:o.fwd>0&&i===0,k:"travel",meta:o,go:()=>travel(o)};
}
function allRoutes(){ return adj(G.at).map(travelInfo).sort((a,b)=>b.fwd-a.fwd||a.min-b.min); }

function mapScreen(){
 show({loc:"🗺️ แผนที่",text:"วงแดงคือตรงนี้ 🏠 คือปลายทาง (อยู่บนสุด) จุด ? คือที่ที่ยังไม่มีข้อมูล 💀 คือที่ที่มีรายงานแก๊ง",html:mapSVG(),k:"mapview",log:false,delta:false,choices:[{l:"← กลับ",primary:true,k:"back",go:nodeMenu}]});
}
function mapSVG(){
 const M=G.map, W=360, rowH=58, H=(M.L+1)*rowH+30, X=n=>30+n.x*(W-60), Y=n=>H-28-n.l*rowH;
 let s=`<div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" width="100%">`;
 M.edges.forEach(e=>{ const a=M.nodes[e.a],b=M.nodes[e.b],T=ETYPES[e.t]; const show=G.vis[e.a]&&G.vis[e.b]; if(!show&&!(G.vis[e.a]||G.vis[e.b]))return;
  s+=`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${T.col}" stroke-width="${T.w}" ${T.dash?`stroke-dasharray="${T.dash}"`:""} opacity="${show?.85:.3}"/>`;
  if(e.blocked>0&&show) s+=`<text x="${(X(a)+X(b))/2}" y="${(Y(a)+Y(b))/2+5}" font-size="13" text-anchor="middle">🚧</text>`; });
 M.nodes.forEach(n=>{ const v=G.vis[n.id], cur=n.id===G.at, home=n.p==="home"; if(!v&&!home&&!M.edges.some(e=>(e.a===n.id&&G.vis[e.b])||(e.b===n.id&&G.vis[e.a])))return;
  const x=X(n),y=Y(n), k=G.known[n.id];
  s+=`<circle cx="${x}" cy="${y}" r="${cur?17:15}" fill="${cur?"#3a0a12":G.seen[n.id]?"#1a1114":"#221519"}" stroke="${cur?"#ff2b3d":home?"#4fd77a":"#3a262b"}" stroke-width="${cur?3:1.5}"/>`;
  s+=`<text x="${x}" y="${y+6}" font-size="${v||home?16:14}" text-anchor="middle" fill="#9a8888">${v||home?(home?"🏠":PLACES[n.p].ic):"?"}</text>`;
  if(n.fire&&v) s+=`<text x="${x+13}" y="${y-8}" font-size="13">🔥</text>`;
  else if(k&&G.min-k.at<150) s+=`<text x="${x+13}" y="${y-8}" font-size="13">💀</text>`;
  if(G.hunter.known&&!G.hunter.dead&&G.hunter.at===n.id) s+=`<text x="${x-24}" y="${y-8}" font-size="13">🎯</text>`; });
 return s+`</svg><div class="legend"><span style="color:#ffb039">━ ทางหลวง</span> <span style="color:#8a7a7a">━ ถนน/ซอย</span> <span style="color:#4fb0ff">━ คลอง</span> <span style="color:#b8a8a8">┅ รางรถไฟ</span> <span style="color:#4fd77a">┈ ท่อ</span></div></div>`;
}
function travel(o){
 const e=o.e, T=ETYPES[e.t], V=VEHS[o.veh];
 if(o.drop){ addLog(`ทิ้ง${G.veh}ไว้ตรงนี้`,"warn"); G.veh=e.t==="canal"?"เดินเท้า":"เดินเท้า"; }
 else if(T.boat&&!o.drop){ /* keep bike/foot */ }
 G.fuel=Math.max(0,G.fuel-o.fuel);
 if(o.runOut){ addLog(`น้ำมันหมดกลางทาง ต้องทิ้ง${G.veh}แล้วเดินต่อ`,"bad"); G.veh="เดินเท้า"; }
 const walking=(o.veh==="เดินเท้า"||o.runOut);
 G.stamina=clamp(G.stamina-(walking?Math.min(30,e.km*2.2):o.veh==="จักรยาน"?e.km*1.2:3),0,100);
 G.noise=clamp(G.noise+(V.noise||0)+(T.nz||0)+(T.dng||0),0,10);
 if(T.sa) G.sanity=clamp(G.sanity+T.sa,0,100);
 G.moves++; const from=G.at;
 passTime(o.min);
 const done=()=>{ G.at=o.to; if(node().fire){ G.hp-=14; addLog("ฝ่าควันไฟเข้ามา สำลักจนแสบคอ","bad"); } arrive(); };
 if(e.blocked>0&&e.t!=="canal"&&e.t!=="sewer"&&e.t!=="rail") return evCheckpoint(done,()=>{ G.at=from; flow(); });
 done();
}
function arrive(opt){
 lookAround();
 if(G.hp<=0||G.at===G.homeId||G.min>=720) return flow();
 const H=G.hunter; if(!H.dead&&H.at===G.at) return flow();
 if(G.gangs.some(x=>x.at===G.at&&!x.met)) return flow();
 if(opt&&opt.noCard) return flow();
 const due=G.chains.findIndex(c=>c.at<=G.moves); if(due>=0){ const id=G.chains.splice(due,1)[0].id; const c=CARDS.find(x=>x.id===id); if(c) return playCard(c); }
 const ph=phase().k, p=clamp(({early:.62,deep:.74,hell:.9,dawn:.7})[ph]+G.noise*.012,0,.96);
 if(chance(p)) return drawCard();
 flow();
}
//========================= CARDS =========================
function drawCard(any){
 const n=node(), ph=phase().k;
 const pool=CARDS.filter(c=>!G.used[c.id]&&(c.at==="*"||c.at.includes(n.p))&&(!c.ph||c.ph.includes(ph))&&(!c.req||c.req(G)));
 if(!pool.length) return flow();
 const wt=c=>(c.w||1)*(c.at==="*"?.55:1.6)*(META.recent.includes(c.id)?.3:1);
 let tot=pool.reduce((s,c)=>s+wt(c),0), r=Math.random()*tot, card=pool[0];
 for(const c of pool){ r-=wt(c); if(r<=0){card=c;break;} }
 playCard(card);
}
function playCard(card){
 G.used[card.id]=1; if(card.fl) G.flags[card.fl]=true;
 if(card.script) return window[card.script]();
 const pl=place(node());
 const ch=card.c.filter(c=>!c[5]||!c[5].req||c[5].req(G)).map(c=>({l:c[0],p:c[2]!=null?pOf(c[2],c[1]):null,k:"card",sub:c[1]&&sk(c[1])>0?"👍 อาชีพคุณถนัดเรื่องนี้":"",go:()=>resolveChoice(card,c)}));
 if(!ch.length) return flow();
 show({loc:`${pl.ic} ${pl.n}`,text:card.t,k:"card",choices:ch,flash:!!card.timer,timer:card.timer,onTimeout:()=>{ const c=card.c[card.c.length-1]; const res=c[4]||c[3]; G.sanity-=5; runRes("ตัวแข็ง คิดไม่ทัน\n\n"+res[0],res[1]); }});
}
function resolveChoice(card,c){
 const ok=c[2]==null||chance(pOf(c[2],c[1])); const res=ok?c[3]:(c[4]||c[3]);
 runRes(res[0],res[1]);
}
function runRes(text,fx){ const d=applyFx(fx||{}); show({loc:place(node()).ic+" "+place(node()).n,text,k:"toast",choices:[{l:"▶ ต่อไป",primary:true,k:"cont",go:()=>after(d)}]}); }
function after(d){
 if(G.hp<=0) return flow();
 if(d.end) return finishEnding(d.end);
 if(d.capture) return captureScene(d.capture);
 if(d.fight){ const f=Array.isArray(d.fight)?d.fight:[d.fight,{}]; return startCombat(f[0],f[1]); }
 if(d.moved) return arrive({noCard:true});
 flow();
}
function sanFx(v){ if(v<0){ v*= (G.trait.id==="calm"?.7:G.trait.id==="jumpy"?1.3:1)*(G.age<=25?1.15:G.age>=46?.85:1); } return v; }
function applyFx(fx){
 const d={};
 if(fx.hp){ let v=fx.hp; if(v<0&&G.trait.id==="reckless")v*=1.15; G.hp=clamp(G.hp+v,-99,G.hpMax); if(v<0){ addLog(`เจ็บ ${Math.round(v)}`,"bad"); heart(); } }
 if(fx.st) G.stamina=clamp(G.stamina+fx.st,0,100);
 if(fx.sa){ G.sanity=clamp(G.sanity+sanFx(fx.sa),0,100); }
 if(fx.nz) G.noise=clamp(G.noise+fx.nz,0,10);
 if(fx.$){ if(fx.$<=-9999){ G.money=0; } else G.money=Math.max(0,G.money+fx.$); }
 if(fx.am) G.ammo=Math.max(0,G.ammo+fx.am);
 if(fx.fu&&!fx.vh){ if(VEHS[G.veh].fuel) G.fuel=clamp(G.fuel+fx.fu,0,100); }
 if(fx.ka) G.karma+=fx.ka;
 if(fx.bl){ G.bleed=Math.max(0,G.bleed+fx.bl); if(fx.bl>0)addLog("เลือดไหลไม่หยุด","bad"); }

function combatWin(){
 const e=G._c; const k=Math.max(1,alive()); G.kills+=k; META.kills+=k; G.karma-=1; killSanity(); if(G.kills>=6)G.flags.hunterPath=true;
 let loot=[]; if(chance(.5)){const m=ri(80,450);G.money+=m;loot.push(`เงิน ${m}`);} if(e.gun&&chance(.6)){const a=ri(1,4);G.ammo+=a;loot.push(`กระสุน ${a}`); if(chance(.4)){const r=giveItem("ปืนพก"); if(r)loot.push(r);} }
 if(chance(.2)){ const r=giveItem(pick(["มีดพก","ไม้เบสบอล","ชุดปฐมพยาบาล","ยากระตุ้น","พาวเวอร์แบงก์"])); if(r)loot.push(r); }
 if(e.key==="punk"&&VEHS[G.veh].sp<25&&chance(.6)){ G.veh="มอไซค์"; G.fuel=Math.max(G.fuel,ri(25,45)); loot.push("มอไซค์ของมัน"); }
 if((e.key==="mask"||e.key==="cult")&&chance(.4)){ const m=e.key==="mask"?"หน้ากากยักษ์":"ชุดขาวผู้ชำระ"; if(!G.masks.includes(m)){G.masks.push(m);loot.push(m);} }
 endCombat(true,pick(["มันล้มลง ไม่ขยับอีก "+me()+"ยืนหอบอยู่เหนือร่างนั้น รอให้มือหยุดสั่น","จบแล้ว เงียบจนได้ยินเสียงเลือดหยดลงพื้น","มันมองหน้า"+me()+"เป็นอย่างสุดท้าย แล้วตาก็ค้างอยู่อย่างนั้น"])+(loot.length?"\n\nค้นตัวได้: "+loot.join(", "):""));
}
function endCombat(won,text,fled){
 const e=G._c; G._c=null; passTime(10);
 const d=won&&e.onWinFx?applyFx(e.onWinFx):{};
 if(G._homeFight){ const hf=G._homeFight; G._homeFight=null; return toast(won?"จบ":"รอด",text,()=>hf(won)); }
 toast(won?"รอดมาได้":fled?"หนีรอด":"มันถอยไป",text,()=>{ if(G.hp<=0) return flow(); if(won&&e.onWin) return fnOf(e.onWin)(); after(d); });
}
function combatLose(){
 const e=G._c; G._c=null;
 if(G._homeFight){ G._homeFight=null; return finishEnding(["raided",2]); }
 if(e.deathEnd) return finishEnding(e.deathEnd);
 if(!G.flags.captured&&["mask","cult","hunter","tourist"].includes(e.key)&&chance(e.key==="hunter"||e.key==="tourist"?.22:.35)) return captureScene(e.key);
 finishEnding(["dead",e.gun?3:pick([2,1,9])]);
}

 <div class="narr">07:00 ไซเรนหยุด รถเก็บขยะเริ่มออกวิ่ง คนออกมาฉีดน้ำล้างหน้าบ้าน ร้านกาแฟเปิดตามปกติ ไม่มีใครพูดถึงเมื่อคืน</div>
 <button class="btn primary" onclick="renderCreate()">▶ คืนถัดไป (ปีที่ ${META.year})</button><button class="btn ghost" onclick="renderBook()">📖 สมุดสะสมตอนจบ</button></div>`;

function renderInv(){
 setTabUI("inv");
 const it=G.inv.map((x,i)=>{ const w=WEAPONS[x]; const use={"ขวดน้ำ":1,"อาหารกระป๋อง":1,"พาวเวอร์แบงก์":1,"ยากระตุ้น":1,"แกลลอนน้ำมัน":1}[x];
  return `<div class="inv-item"><div class="nm">${x}${x===G.weapon?" ✅":""}</div><div class="meta">${w?`แรง ${w.dmg}${w.dur<999?` • ทน ${w.dur-(G.wear[x]||0)}`:""}${w.gun?" • ปืน":""}`:"ไอเทม"}</div><div style="margin-top:6px">${w&&x!==G.weapon?`<span class="chip" onclick="invDo('eq',${i})">ถือ</span>`:""}${use?`<span class="chip" onclick="invDo('use',${i})">ใช้</span>`:""}<span class="chip" onclick="invDo('drop',${i})">ทิ้ง</span></div></div>`; }).join("");
 const cp=G.comps.map(c=>`<div class="inv-item"><div class="nm">${c.dog?"🐕":"🧍"} ${c.name}</div><div class="meta">${c.hp>60?"ยังไหว":c.hp>30?"เจ็บ":"แย่"}</div></div>`).join("");
 side.innerHTML=`<div class="scr"><h3>🎒 ของติดตัว (${G.inv.length}/10)</h3><div class="small">ถืออยู่: <b>${G.weapon}</b></div><div class="inv-grid" style="margin-top:8px">${it||'<div class="small">ไม่มีอะไรเลย</div>'}</div>
 ${G.masks.length?`<h3 style="margin-top:14px">🎭 ชุดปลอมตัว</h3><div class="small">${G.masks.join(", ")}</div>`:""}
 ${G.partner?`<h3 style="margin-top:14px">💘 คนที่เดินมาด้วย</h3><div class="inv-item"><div class="nm">${G.partner.name}</div><div class="meta">${G.partner.perk}</div></div>`:""}
 <h3 style="margin-top:14px">👥 คนร่วมทาง (${G.comps.length}/3)</h3><div class="inv-grid">${cp||'<div class="small">เดินคนเดียว</div>'}</div><hr class="hr">
 <div class="small">${G.gender==="m"?"ชาย":"หญิง"} ${G.age} ปี • <b>${G.job.name}</b> — ${G.job.perk}</div><div class="small">${ageNote()}</div><div class="small">นิสัย: <b>${G.trait.name}</b> — ${G.trait.desc}</div>
 <div class="small">ปลายทาง: <b>${G.dest}</b> • คนที่รอ: <b>${G.w.rel}</b> • รหัสลับ: <b>${G.secretCode}</b></div><div class="small">กฎคืนนี้: <b>${G.ruleText}</b></div></div>`;
}
function invDo(a,i){ const x=G.inv[i]; if(!x||G.over)return;
 if(a==="eq"){ if(WEAPONS[x])G.weapon=x; }
 else if(a==="drop"){ G.inv.splice(i,1); if(G.weapon===x&&!G.inv.includes(x))G.weapon="มือเปล่า"; }
 else { G.inv.splice(i,1); if(x==="ขวดน้ำ")G.stamina=clamp(G.stamina+20,0,100); if(x==="อาหารกระป๋อง"){G.stamina=clamp(G.stamina+25,0,100);G.hp=clamp(G.hp+5,0,G.hpMax);} if(x==="พาวเวอร์แบงก์")G.phoneBat=clamp(G.phoneBat+60,0,100); if(x==="ยากระตุ้น")takeDrug(); if(x==="แกลลอนน้ำมัน"){ if(VEHS[G.veh].fuel)G.fuel=clamp(G.fuel+25,0,100); else G.inv.push(x); } }
 renderInv();
}
function renderBook(){
 setTabUI("book"); const n=Object.keys(META.endings).length;
 let h=`<div class="scr"><h3>📖 สมุดสะสม</h3><div class="panel"><div class="kv"><span>ตอนจบที่พบ</span><b>${n}/100</b></div><div class="kv"><span>ผ่านมาแล้ว</span><b>${META.runs} คืน</b></div><div class="kv"><span>ถึงที่พักแบบมีชีวิต</span><b>${META.arrived} คืน</b></div><div class="kv"><span>ช่วยคนไปแล้ว</span><b>${META.saved}</b></div></div>`;
 END_ORDER.forEach(cat=>{ const c=ENDINGS[cat]; h+=`<h3 style="margin-top:14px;font-size:15px">${c.cat} <span class="small">${c.list.filter((x,i)=>META.endings[cat+":"+i]).length}/10</span></h3><div class="end-grid">`;
  c.list.forEach((x,i)=>{ h+=META.endings[cat+":"+i]?`<div class="end-row"><b>${x[0]}</b><div class="small" style="margin-top:3px">${(typeof x[1]==="string"?x[1]:x[1].y).replace(/\{W\}/g,"คนที่รอ").replace(/\{ME\}/g,"เรา")}</div></div>`:`<div class="end-row locked">🔒 ???</div>`; }); h+="</div>"; });
 h+=(!G||G.over?`<button class="btn primary" style="margin-top:16px" onclick="renderTitle()">← กลับ</button>`:"")+`<button class="btn ghost" style="margin-top:16px" id="rstBtn" onclick="confirmReset()">🗑️ ล้างข้อมูลทั้งหมด</button></div>`;
 side.innerHTML=h;
}
let _rst=0;
function confirmReset(){ if(Date.now()-_rst>4000){_rst=Date.now();$("#rstBtn").textContent="⚠️ กดอีกครั้งเพื่อยืนยัน";return;} try{localStorage.removeItem(MKEY);localStorage.removeItem(SKEY);}catch(e){} META=META_DEF(); G=null; renderTitle(); }
function setNav(s){ $("#nav").style.display=s?"flex":"none"; const w=$("#navWho"); if(w&&G&&G.w)w.textContent=G.w.n; }
function setTabUI(t){ tab=t; app.style.display=t==="game"?"":"none"; side.style.display=t==="game"?"none":""; document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); }
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ if(!G||G.over)return; const t=b.dataset.tab; t==="game"?setTabUI("game"):t==="chat"?renderChat():t==="inv"?renderInv():renderBook(); });
//========================= TITLE / PREP =========================
function renderTitle(){
 setNav(false); setTabUI("game"); clearTimer(); app.classList.remove("glitch"); const s=$("#scrim"); if(s)s.style.boxShadow="none"; UI.choices=[];
 const n=Object.keys(META.endings).length, sv=load(SKEY,null), can=sv&&sv.v===VER&&!sv.over;
 app.innerHTML=`<div class="scr title-wrap"><div class="logo">OVERTIME<small>คืนไร้กฎ</small></div>
 <div class="tag">ปีละหนึ่งคืน สิบสองชั่วโมง ไม่มีกฎหมาย<br>คืนนี้คุณกลับไม่ทันไซเรน และมีคนรออยู่ที่ปลายทาง<br><b style="color:var(--red)">ไปให้ถึงก่อน 07:00</b></div>
 ${META.runs?`<div class="small">ปีที่ ${META.year} • ตอนจบ ${n}/100 • ผ่านมา ${META.runs} คืน</div>`:""}${META.scars.length?`<div class="small" style="color:var(--amber)">สิ่งที่ติดตัวมาจากปีก่อน: ${META.scars.join(", ")}</div>`:""}
 ${can?`<button class="btn primary" onclick="resumeRun()">⏯️ เล่นต่อ</button>`:""}<button class="btn ${can?"":"primary"}" onclick="renderCreate()">🩸 เริ่มคืนใหม่</button>
 ${n?`<button class="btn ghost" onclick="renderBook()">📖 สมุดสะสมตอนจบ (${n}/100)</button>`:""}<div class="small" style="margin-top:20px;color:#5a4a4d">เรื่องแต่งทั้งหมด • มีความรุนแรง • เซฟอัตโนมัติในเครื่องนี้</div></div>`;
}
function resumeRun(){ const s=load(SKEY,null); if(!s||s.v!==VER)return renderTitle(); G=s; G.job=JOBS.find(j=>j.id===G.job.id)||G.job; G._c=null; G.flags=G.flags||{}; flow(); }
function renderCreate(){
 setNav(false); setTabUI("game"); G=null;
 app.innerHTML=`<div class="scr"><h2>คืนนี้คุณเป็นใคร</h2><div class="tag">เลือกได้แค่เพศ ที่เหลือโชคชะตาเลือกให้: อายุ อาชีพ นิสัย จุดที่ติดอยู่ ปลายทาง และคนที่รอ</div>
 <button class="btn primary" onclick="newRun('m',$('#nm').checked)">♂ ชาย</button><button class="btn primary" onclick="newRun('f',$('#nm').checked)">♀ หญิง</button>
 <div class="panel"><label style="display:flex;gap:8px;font-size:14px"><input type="checkbox" id="nm"><span><b>โหมดไร้ปรานี</b> — ไม่บอกโอกาสสำเร็จ ศัตรูแกร่งขึ้น</span></label></div><button class="btn ghost" onclick="renderTitle()">← กลับ</button></div>`;
}
function renderPrep(){
 setNav(false); const n=node(), pl=place(n), own=G.job.home.includes(n.p);
 const pool=[...new Set(pl.loot.filter(x=>x!=="-"))].concat(["ขวดน้ำ","$s","ไฟฉาย","ชุดปฐมพยาบาล","พาวเวอร์แบงก์"]); const picks=[...new Set(pool)].slice(0,6); let chosen=[];
 const lbl=t=>t==="$s"||t==="$m"||t==="$l"?"เงินสดที่วางอยู่":t==="fuel"?"แกลลอนน้ำมัน":t==="ammo"?"กล่องกระสุน":t.startsWith("veh:")?"กุญแจ"+t.slice(4):t;
 const why=own?G.job.why:pick(["รถเที่ยวสุดท้ายไม่มา","โดนปล้นกลางทางจนไม่เหลืออะไร","รถเสียกลางทาง","ไปธุระแล้วกลับไม่ทัน","หลงทางตอนหาทางลัดกลับ"])+" เลยมาติดอยู่แถว"+pl.n;
 const draw=()=>{ app.innerHTML=`<div class="scr"><div class="loc">18:52 • ${pl.ic} ${pl.n} ${G.routeFrom}</div><h2>คืนนี้คุณคือ</h2>
  <div class="panel"><div class="kv"><span>ตัวตน</span><b>${G.gender==="m"?"ชาย":"หญิง"} ${G.age} ปี • ${G.job.name}</b></div><div class="kv"><span>นิสัย</span><b>${G.trait.name}</b></div><div class="kv"><span>ปลายทาง</span><b>${G.dest}</b></div><div class="kv"><span>ระยะทาง</span><b>${G.map.km} กม.</b></div><div class="kv"><span>คนที่รอ</span><b>${G.w.rel}${G.w.name?" “"+G.w.name+"”":""}</b></div><div class="kv"><span>พาหนะ</span><b>${G.veh}</b></div>
  <div class="small" style="margin-top:8px;color:var(--amber)">${G.job.perk}</div><div class="small" style="margin-top:4px">${ageNote()} • ${G.trait.desc}</div></div>
  <div class="narr">${why} เหลืออีกแปดนาทีก่อนไซเรน คว้าของได้ 3 อย่าง</div>
  <div class="panel"><div class="small">กฎปีนี้: <b style="color:var(--amber)">${G.ruleText}</b></div><div class="small" style="margin-top:6px">🔐 รหัสลับที่นัดกับ${G.w.n}: <b style="color:var(--green)">${G.secretCode}</b> ถ้าสงสัยว่าคนที่ตอบแชตไม่ใช่${G.w.n} ให้ถาม</div></div>
  <div id="ll"></div><button class="btn primary" id="goBtn">🚨 ไซเรนดัง</button></div>`;
  picks.forEach((t,i)=>{ const b=document.createElement("button"); b.className="btn sm"+(chosen.includes(i)?" primary":""); b.textContent=(chosen.includes(i)?"✅ ":"")+lbl(t); b.onclick=()=>{ chosen.includes(i)?chosen=chosen.filter(x=>x!==i):chosen.length<3&&chosen.push(i); draw(); }; $("#ll").appendChild(b); });
  $("#goBtn").onclick=()=>startNight(chosen.map(i=>picks[i])); };
 draw(); window.__prep=()=>startNight(picks.slice(0,3));
}
function startNight(toks){ toks.forEach(t=>giveLoot(t,true)); G.log=[]; G._newLog=0; G.min=0; siren(); setNav(true);
 show({loc:"🚨 19:00",text:"ไซเรนดังยาวสามครั้ง เสียงประกาศจากลำโพงทุกเสา “ขณะนี้เวลาสิบเก้านาฬิกา กฎหมายทุกฉบับถูกระงับใช้เป็นเวลาสิบสองชั่วโมง ขอให้ทุกท่านโชคดี”\n\nแล้วทั้งเมืองก็เงียบ เงียบอยู่ประมาณสิบวินาที",narr:"กฎปีนี้: "+G.ruleText+(META.runs<=2?"\n\nเป้าหมาย: ไปให้ถึง 🏠 ก่อน 07:00 แต่ละจุดเลือกว่าจะไปทางไหนต่อ หรือทำอะไรที่นั่นก่อน ทุกอย่างใช้เวลา":""),k:"toast",log:false,delta:false,choices:[{l:"▶ ไป",primary:true,k:"cont",go:flow}]}); }
//========================= BOT (smoke test) =========================
window.runBot=function(n,smart){ window.__BOT=true; const out={ends:{},err:[],stuck:0,arr:0,alive:0,n};
 for(let r=0;r<n;r++){ try{ newRun(chance(.5)?"m":"f",false); window.__prep(); let st=0;
   while(!G.over&&st++<900){ const cs=UI.choices.filter(c=>!c.dis); if(!cs.length){out.stuck++;out.err.push("nochoice:"+UI.scene);break;}
    if(st%9===4&&G.phoneBat>0) chatSend(G.flags.pendingUncle?pick(["uy","un"]):pick(["safe","code","cheer","hide"]));
    let c=null;
    if(smart){ const sc=UI.scene;
     if(sc==="menu"){ const f=k=>cs.find(x=>x.k===k); const t=cs.filter(x=>x.k==="travel"); const sco=x=>-x.meta.fwd*200+x.meta.min+(x.meta.gang?70:0)+(x.meta.fire?50:0)+(x.meta.e.blocked>0?40:0)+(x.meta.drop?250:0)+(x.meta.runOut?60:0)+Math.random()*10;
      c=(((G.bleed>0||G.hp<G.hpMax*.5)&&(G.inv.includes("ชุดปฐมพยาบาล")||G.bleed>0))?f("heal"):null)||(((VEHS[G.veh].sp<20&&kmLeft()>(720-G.min)/60*4)||(VEHS[G.veh].fuel&&G.fuel<12))?f("search"):null)||t.sort((a,b)=>sco(a)-sco(b))[0]; }
     else if(sc==="more"||sc==="mapview"||sc==="help"||sc==="cmore"){ c=cs.find(x=>x.k==="back")||cs[0]; if(sc==="more"&&G.stamina<22&&!G._bh){G._bh=1;c=cs.find(x=>x.k==="hide")||c;} }
     else if(sc==="combat"){ const f=k=>cs.find(x=>x.k===k), a=f("attack"), fl=f("flee"); c=(G.hp<G.hpMax*.3&&fl&&fl.p>.3)?fl:(a&&a.p>=.35)?a:f("close")||a||f("defend"); }
     else { const safe=cs.filter(x=>x.k!=="back"&&x.k!=="end"&&x.k!=="betray"&&x.k!=="rush"); const pool=safe.length?safe:cs; c=pool.slice().sort((a,b)=>((b.p==null?.6:b.p)+Math.random()*.25+(b.k==="fight"?-.3:0)+(b.k==="careful"?.4:0))-((a.p==null?.6:a.p)+Math.random()*.25+(a.k==="fight"?-.3:0)+(a.k==="careful"?.4:0)))[0]; } }
    (c||pick(cs)).go(); }
   if(!G.over){ out.stuck++; out.err.push("loop:"+UI.scene+":"+G.min); } else { const k=G.ending.cat+":"+G.ending.i; out.ends[k]=(out.ends[k]||0)+1; if(G.ending.arrived)out.arr++; if(G.ending.alive)out.alive++; }
  }catch(e){ out.err.push(String(e&&e.stack||e).slice(0,300)); } }
 window.__BOT=false; return out; };
renderTitle();

</script></body></html>
