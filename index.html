<title>OVERTIME: คืนไร้กฎ</title><style>
:root{
  --bg:#0a0607; --bg2:#120a0c; --ink:#e8dcdc; --dim:#9a8888; --red:#ff2b3d; --red2:#b0121f;
  --neon:#ff3b5c; --amber:#ffb039; --green:#4fd77a; --blue:#4fb0ff; --panel:#160d10; --line:#2a1a1e;
}

/* ================= VISUAL v3: CCTV / ประกาศฉุกเฉิน ================= */
body{font-family:"IBM Plex Sans Thai","Sukhumvit Set","Noto Sans Thai",sans-serif;background:#070405}
.logo,.loc,.btn,.hud,.sec,h2,h3,.kv b,.clock,.road-km,.night-badge,.cost,.ticker{font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:41;opacity:.07;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .6s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
#app::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:39;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.scr{animation:crtIn .22s ease-out}
@keyframes crtIn{0%{opacity:0;filter:brightness(2.2) saturate(0);transform:scaleY(.985)}60%{opacity:1;filter:brightness(1.2)}100%{filter:none;transform:none}}
.panel{border-radius:4px;border:1px solid #3a2228;background:linear-gradient(180deg,#140b0d,#0e0809);position:relative;
 box-shadow:inset 0 0 0 1px rgba(255,59,92,.04),0 8px 24px rgba(0,0,0,.45)}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border-color:rgba(255,176,57,.55);border-style:solid;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.loc{letter-spacing:.5px;text-transform:uppercase;font-size:12px;color:var(--amber)}
@keyframes rec{50%{opacity:.15}}
.btn{border-radius:3px;letter-spacing:.3px;position:relative;overflow:hidden}
.btn.primary{background:linear-gradient(180deg,#e0263f,#9c1427);border:1px solid #ff5a72;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 18px rgba(255,59,92,.25)}
.btn.primary::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.btn:active{filter:brightness(1.3)}
.btn.ghost{border-style:dashed}
img.pxi{image-rendering:pixelated;width:64px;height:64px;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 8px rgba(255,59,92,.25))}
.tic img.pxi{width:28px;height:28px;margin:0;display:inline-block;vertical-align:middle;filter:none}
.scene-ic{line-height:1}
.hud{font-family:"Chakra Petch",sans-serif;border-bottom:1px solid #2a1a1e;background:linear-gradient(180deg,rgba(10,6,7,.96),rgba(10,6,7,.85))}
.hud .clock::before{content:"● REC ";color:var(--neon);font-size:11px;animation:rec 1.2s steps(2) infinite;vertical-align:middle}
.road{border-radius:2px;background:repeating-linear-gradient(90deg,#1a0f12 0 9px,#0a0607 9px 10px)!important}
.road-fill{border-radius:0!important;background:repeating-linear-gradient(90deg,var(--neon) 0 9px,transparent 9px 10px)!important;box-shadow:0 0 10px rgba(255,59,92,.5)}
img.phrt{width:18px;height:18px;image-rendering:pixelated;vertical-align:middle;margin-right:2px}
img.hudpt{width:34px;height:34px;image-rendering:pixelated;border:1px solid #3a2228;background:#120a0c;vertical-align:middle;margin-right:6px}
.logo{font-family:"Chakra Petch",sans-serif;position:relative;animation:glitch 4s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:0 0 18px rgba(255,59,92,.6);transform:none}93%{text-shadow:-3px 0 #4fb0ff,3px 0 #ff3b5c;transform:translateX(2px)}95%{text-shadow:3px 0 #4fb0ff,-3px 0 #ff3b5c;transform:translateX(-2px)}97%{text-shadow:none;transform:skewX(8deg)}}
.skyline{display:block;width:100%;image-rendering:pixelated;border:1px solid #2a1a1e;border-radius:3px;margin:-6px 0 10px;background:#05030a}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid #3a2228;background:#120709;color:var(--amber);font-size:13px;padding:6px 0;margin:4px 0 10px;border-radius:3px}
.ticker b{color:#fff;background:var(--neon);padding:2px 6px;margin-right:8px;position:relative;z-index:1}
.ticker span{display:inline-block;padding-left:100%;animation:tick 38s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
#intro{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px}
#intro canvas{width:min(100%,560px);image-rendering:pixelated;border:1px solid #2a1a1e}
#intro .cap{font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif;color:#eadfcd;font-size:18px;min-height:56px;text-align:center;max-width:560px;line-height:1.5}
#intro .cap em{color:var(--neon);font-style:normal}

.todo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.todo span{font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif;font-size:12.5px;padding:3px 8px;border-radius:3px;background:#1d1013;border:1px solid #4a2a30;color:#f3e7d6}
.todo span.t1{border-color:var(--amber);color:var(--amber);background:#221608;animation:todoP 2.4s ease-in-out infinite}
@keyframes todoP{50%{box-shadow:0 0 0 2px rgba(255,176,57,.18)}}
.btn.suggest{border-color:var(--amber)!important;box-shadow:0 0 0 1px rgba(255,176,57,.4),0 0 16px rgba(255,176,57,.18)}
.btn.suggest::before{content:"แนะนำ";position:absolute;top:0;right:0;background:var(--amber);color:#1a0f05;font-size:10.5px;font-weight:700;padding:1px 6px;border-bottom-left-radius:3px;font-family:"Chakra Petch",sans-serif}
.trend{font-size:11px;color:#b9a9ad;margin-left:3px}
img.mini{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;border:1px solid #3a2228;background:#120a0c;margin-left:2px}
img.chatav{width:36px;height:36px;image-rendering:pixelated;vertical-align:middle;border:1px solid #3a2228;margin-right:8px;background:#120a0c}
#inter{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:crtIn .3s ease-out;cursor:pointer}
#inter canvas{width:min(92vw,520px);image-rendering:pixelated;border:1px solid #2a1a1e}
#inter .ih{font-family:"Chakra Petch",sans-serif;color:var(--neon);letter-spacing:2px;font-size:13px}
#inter .it{font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif;color:#eadfcd;font-size:20px;text-align:center;max-width:520px;padding:0 16px}
#inter .is{color:#8a7a7e;font-size:12px}

#intro>*{flex:0 0 auto}
.endcam{display:flex;gap:12px;align-items:center;justify-content:center;margin:0 auto 10px;padding:8px 12px;border:1px solid #3a2228;background:#0e0809;width:max-content;max-width:100%;font-family:"Chakra Petch",sans-serif}
.endcam b{display:block;color:var(--neon);font-size:12px;letter-spacing:.5px}.endcam span{font-size:12px;color:#9a8a8e}
img.endpt{width:64px;height:64px;image-rendering:pixelated;filter:grayscale(.6) contrast(1.2);border:1px solid #3a2228}
.timecard{position:relative;background:#e9dfc9;color:#2a1a14;border-radius:3px;padding:12px 14px;margin:4px 0 14px;font-family:"Chakra Petch",monospace;box-shadow:0 6px 18px rgba(0,0,0,.5);transform:rotate(-1deg)}
.timecard .tc-h{display:flex;justify-content:space-between;border-bottom:1px dashed #8a7a66;padding-bottom:6px;margin-bottom:6px}.timecard .tc-h span{font-size:12px;color:#6b5a48}
.timecard .tc-row{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}.tc-late{color:#b3162f}
.timecard .tc-stamp{display:table;margin:6px 0 0 auto;border:2px solid #b3162f;color:#b3162f;padding:2px 8px;font-weight:700;transform:rotate(-12deg);opacity:.85;font-size:13px}
#intro .bar{display:flex;justify-content:space-between;align-items:center;width:min(100%,560px);color:#7a6a6e;font-size:13px;font-family:"Chakra Petch",sans-serif}
#intro .bar button{background:none;border:1px solid #3a2228;color:#cbbfc1;padding:8px 14px;border-radius:3px;font-family:inherit;width:auto;height:auto;min-height:0;margin:0;flex:0 0 auto;font-size:14px}

body.dawnth{--red:#3bd1ff;--red2:#126a8a;--neon:#3bd1ff}
#otpop{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;width:min(92vw,440px);pointer-events:none}
#otpop div{background:#1d1114;border:1px solid var(--amber);color:var(--amber);border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#otpop small{display:block;color:var(--ink);font-weight:400}
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.cal div{border:1px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;font-size:13px;background:var(--bg2)}
.cal div.on{border-color:var(--amber);color:var(--amber)}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach.lock{opacity:.5}.ach .ai{font-size:22px;width:30px;text-align:center}
.prog{height:6px;background:#000;border-radius:4px;margin-top:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;line-height:1.55;
  overflow-x:hidden}
body{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
#app{padding:14px 14px 90px}
h1,h2,h3{margin:0 0 8px;font-weight:800;}
.scr{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.title-wrap{text-align:center;padding:40px 10px 20px}
.logo{font-size:44px;line-height:1;font-weight:900;color:var(--red);
  text-shadow:0 0 18px rgba(255,43,61,.55),0 0 2px #fff;}
.logo small{display:block;font-size:15px;color:var(--amber);margin-top:8px;font-weight:700}
.tag{color:var(--dim);font-size:13px;margin:16px 6px;line-height:1.6}
.btn{display:block;width:100%;padding:15px;margin:9px 0;border:1px solid var(--line);
  background:linear-gradient(180deg,#1c1013,#140b0e);color:var(--ink);border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;transition:.15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--red),var(--red2));border-color:#ff5e6e;
  color:#fff;box-shadow:0 0 16px rgba(255,43,61,.4)}
.btn.ghost{background:transparent}
.btn.sm{padding:10px;font-size:14px;margin:6px 0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.choices .btn{text-align:left;position:relative;padding-right:60px}
.pct{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800;
  color:var(--amber)}
.pct.hi{color:var(--green)} .pct.lo{color:var(--red)}
.cost{font-size:12px;color:var(--dim);font-weight:500;margin-top:3px}
.hud{position:sticky;top:0;z-index:40;background:rgba(10,6,7,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:-14px -14px 12px;padding:10px 14px}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}
.clock{font-weight:800;font-size:16px}
.night-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}
.nb-calm{background:#1a2a1e;color:var(--green)} .nb-hell{background:#2a0e12;color:var(--red);
  animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.road{height:10px;background:#1a0f12;border-radius:6px;position:relative;margin:4px 0 8px;overflow:hidden}
.road-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--red2),var(--red));
  border-radius:6px;transition:width .5s}
.road-km{position:absolute;right:6px;top:-1px;font-size:10px;color:#fff;font-weight:800;
  text-shadow:0 0 3px #000}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{flex:1 1 auto;font-size:12px;display:flex;align-items:center;gap:3px;min-width:52px}
.bar{flex:1;height:6px;background:#241317;border-radius:4px;overflow:hidden;min-width:30px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}
.loc{font-size:12px;color:var(--amber);font-weight:700;}
.story{font-size:15.5px;line-height:1.7;margin:10px 0;white-space:pre-wrap}
.carry{font-size:14px;line-height:1.65;white-space:pre-wrap;background:rgba(255,43,61,.07);border-left:3px solid var(--red);padding:8px 10px;margin:0 0 10px;border-radius:6px}
.carry b{color:var(--amber)}
.flash{animation:flash .5s}
@keyframes flash{0%{background:#3a0a0e}100%{background:var(--panel)}}
.narr{color:var(--dim);font-size:13.5px;line-height:1.65;margin:8px 0;
  border-left:2px solid var(--red2);padding-left:10px}
.log{font-size:12.5px;color:var(--dim);margin:6px 0;line-height:1.5}
.log b.good{color:var(--green)} .log b.bad{color:var(--red)} .log b.warn{color:var(--amber)}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:flex;background:rgba(14,8,10,.98);border-top:1px solid var(--line);z-index:50}
.navbar button{flex:1;padding:11px 4px;background:none;border:none;color:var(--dim);font-size:11px;
  cursor:pointer;font-weight:600}
.navbar button .ic{display:block;font-size:19px;margin-bottom:1px}
.navbar button.on{color:var(--red)}
.badge-n{position:absolute;top:5px;margin-left:16px;background:var(--red);color:#fff;font-size:9px;
  padding:1px 5px;border-radius:10px;font-weight:800}
.chat{max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;margin:6px 0;font-size:14px;line-height:1.5;
  clear:both;word-wrap:break-word}
.msg.them{background:#1e1316;float:left;border-bottom-left-radius:4px}
.msg.me{background:linear-gradient(180deg,#8a1020,#6a0c18);color:#fff;float:right;
  border-bottom-right-radius:4px}
.msg .t{display:block;font-size:10px;color:var(--dim);margin-top:3px}
.msg.me .t{color:#ffb0b8}
.typing{float:left;color:var(--dim);font-size:12px;clear:both;padding:4px 8px}
.seg{display:flex;gap:8px;margin:10px 0}
.seg .btn{margin:0}
.chip{display:inline-block;padding:4px 9px;background:#1e1216;border:1px solid var(--line);
  border-radius:20px;font-size:12px;margin:3px 3px 0}
.chip.on{background:var(--red2);border-color:var(--red);color:#fff}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-item{background:#1a1013;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px}
.inv-item .nm{font-weight:700} .inv-item .meta{font-size:11px;color:var(--dim);margin-top:3px}
.end-grid{display:grid;grid-template-columns:1fr;gap:7px}
.end-row{background:#160d10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.end-row.locked{color:#5a4a4d} .end-row .ec{font-size:11px;color:var(--amber)}
.big-end{text-align:center;padding:24px 10px}
.big-end .et{font-size:26px;font-weight:900;color:var(--red);text-shadow:0 0 14px rgba(255,43,61,.5);margin:8px 0}
.big-end .ecat{font-size:12px;color:var(--amber);}
.scrim-red{position:fixed;inset:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 80px 20px rgba(255,0,20,0);
  transition:box-shadow .6s}
.timer-bar{height:4px;background:#241317;border-radius:3px;overflow:hidden;margin:8px 0}
.timer-bar>i{display:block;height:100%;background:var(--red);width:100%;transition:width .1s linear}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.center{text-align:center}
.small{font-size:12px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #1a1114}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.glitch{animation:glitch .25s infinite}
@keyframes glitch{0%{transform:none;filter:none}50%{transform:translateX(1px);filter:hue-rotate(20deg)}}
.radio{background:#0e1420;border:1px solid #1a2436;border-radius:10px;padding:9px 12px;font-size:12.5px;
  color:#8fb0d0;margin:8px 0}
.radio b{color:#bfe0ff}
.tv{background:#1a0a0e;border:1px solid var(--red2);border-radius:10px;padding:9px 12px;font-size:12.5px;
  color:#ffb0b8;margin:8px 0}
.warnmsg{color:var(--amber);font-size:12px;margin:6px 0;line-height:1.5}
.dead .story{color:var(--red)}

.wounds{font-size:11px;color:var(--red);margin-top:5px}
.mapwrap{background:#0e0809;border:1px solid var(--line);border-radius:14px;padding:6px;margin:10px 0}
.legend{font-size:10.5px;color:var(--dim);text-align:center;padding:2px 0 4px}
.chip{cursor:pointer}

.logo{letter-spacing:2px}
.btn,.chip,.stat,.kv,.small,.loc{line-height:1.5}
.btn{font-family:inherit}
input,button{font-family:inherit}
.story{line-height:1.8}
.logo small{margin-top:10px;line-height:1.6}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dchip{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:#1e1216;border:1px solid var(--line);color:var(--dim)}

 clinic:{front:["คลินิกสัตว์ กรงหมาแมวเรียงชิดผนัง ทุกตัวเงียบผิดปกติ ตาจ้องประตูเหมือนกันหมด","ป้ายประกาศ ‘รับฝากสัตว์คืนนี้ ปลอดภัย 100%’ ติดอยู่ข้างกระจกที่แตก"],store:["ห้องยา ตู้กระจกเรียงขวดยาฉีดกับผ้าพันแผล ส่วนใหญ่ยังอยู่ คนส่วนมากไม่คิดว่าคลินิกสัตว์มีของ","โต๊ะผ่าตัดสแตนเลส มีเครื่องมือวางเรียงครบเหมือนหมอเพิ่งเตรียมไว้"]},
 gym:{front:["ค่ายมวย กระสอบทรายแกว่งเบาๆ ทั้งที่ไม่มีลม เวทีมวยกลางห้องมีรอยเลือดเพิ่งแห้ง","เสียงระฆังหมดยกดังขึ้นเองจากเครื่องจับเวลา ทุกสามนาที"],store:["ห้องเก็บอุปกรณ์ นวมแขวนเรียง ผ้าพันมือ น้ำมันมวย และเหรียญรางวัลที่ถูกทิ้งกระจาย","มีนักมวยเด็กสองคนนั่งพันมือกันเงียบๆ ในมุมห้อง เงยหน้ามองแล้วกำหมัดพร้อมกัน"]},
 fireworks:{front:["ร้านประทัด ป้าย ‘ห้ามสูบบุหรี่’ ตัวโตทุกผนัง มีก้นบุหรี่ยังติดไฟอยู่หน้าประตู","กล่องพลุเปิดทิ้งกระจาย ดินปืนโรยเป็นทางยาวจากหน้าร้านไปถึงหลังร้าน เหมือนใครตั้งใจทำชนวน"],store:["โกดังหลังร้าน กล่องประทัดยักษ์ซ้อนสูงจนถึงเพดาน ถ้าระเบิดตรงนี้ ทั้งซอยหาย","มีถังน้ำวางไว้ทุกมุม กับป้ายเขียนมือว่า ‘ถ้าไฟติด อย่าวิ่ง วิ่งก็ไม่ทัน’"]},
 gas:{front:["ลานหัวจ่ายสว่างจ้าเพราะไฟเพดาน เป็นที่ที่สว่างที่สุดในรัศมีหลายกิโล ใครยืนตรงนี้ก็คือเป้า","หัวจ่ายหัวหนึ่งถูกดึงหลุด น้ำมันไหลนองพื้นเป็นแอ่ง กลิ่นแรงจนเวียนหัว"],store:["มินิมาร์ทในปั๊ม ชั้นขนมโล่งหมด เหลือแต่น้ำมันเครื่องกับที่ปัดน้ำฝน","พนักงานปั๊มนั่งอยู่หลังเคาน์เตอร์ ถือไฟแช็กไว้ในมือ อีกมือถือสายยางที่ต่อจากหัวจ่าย ‘เข้ามาใกล้กว่านี้ ระเบิดกันหมด’"]},
 terminal:{front:["ชานชาลารถทัวร์ กระเป๋าเดินทางถูกทิ้งเรียงยาว ป้ายไฟยังแสดงเที่ยว ‘19:15 ยกเลิก’","รถทัวร์คันหนึ่งติดเครื่องรออยู่ ประตูเปิด คนขับไม่อยู่ เบาะนั่งเต็มไปด้วยคนนั่งนิ่ง"],store:["ห้องขายตั๋ว กระจกกันกระสุนมีรูกระสุนเป็นแนว คนขายตั๋วยังนั่งอยู่ ไม่หายใจแล้ว","ลิ้นชักเก็บเงินเปิดอ้า ธนบัตรปลิวว่อน ไม่มีใครเก็บ คืนนี้เงินไม่ใช่สิ่งที่คนอยากได้ที่สุด"]},
 factory:{floor:["สายพานยังวิ่งช้าๆ ส่งกล่องเปล่าไปลงเครื่องบด กล่อง กล่อง กล่อง แล้วก็อะไรบางอย่างที่ไม่ใช่กล่อง","ป้ายนับวันทำงานไม่มีอุบัติเหตุ ถูกแก้ตัวเลขเป็น 0 ด้วยเลือด"],office:["ห้องหัวหน้างาน ชื่อบนป้ายประตูถูกขีดฆ่า มีรายชื่อพนักงานที่ถูกไล่ออกปีนี้แปะบนโต๊ะ ทุกชื่อมีเครื่องหมายถูก","ตู้เซฟเปิดค้าง ข้างในว่าง เหลือแค่ซองเงินเดือนที่เขียนว่า ‘โบนัส ยกเลิก’"]},
 warehouse:{floor:["ชั้นวางสูงห้าเมตรเรียงเป็นเขาวงกต รถยกจอดขวางทางหนึ่ง กุญแจยังเสียบ","พาเลทไม้ถูกจัดเป็นห้องเล็กๆ กลางโกดัง มีผ้าห่ม เตา กับปฏิทินที่ขีดฆ่าทุกวันจนถึงวันนี้"],yard:["ลานขนของ ตู้คอนเทนเนอร์วางซ้อนสามชั้น ตู้หนึ่งมีเสียงทุบจากข้างในเป็นจังหวะ","รถหัวลากจอดติดเครื่อง ไฟหน้าส่องตรงมาที่ทางเข้า ไม่มีคนขับ หรือมีแต่ก้มอยู่"]},
 site:{floor:["โครงตึกที่สร้างไม่เสร็จ เหล็กเส้นโผล่จากเสาเหมือนขวากหนาม ลมพัดผ่านชั้นโล่งเสียงหวีดหวิว","บนพื้นปูนมีรอยเท้าคนเปลือยเท้าเดินวนเป็นวงกลม รอบแล้วรอบเล่า"],office:["ตู้คอนเทนเนอร์สำนักงานไซต์ แบบแปลนตึกปูเต็มโต๊ะ มีคนวงสีแดงไว้ที่ชั้นห้า เขียนว่า ‘เอาไปทิ้งตรงนี้’","หมวกนิรภัยเรียงบนชั้น ชื่อคนงานเขียนด้วยปากกาเมจิก บางใบมีรอยบุบตรงกลาง"]},
 junkyard:{floor:["กองซากรถสูงเป็นภูเขา ทางเดินระหว่างกองแคบจนต้องเดินตะแคง เหล็กแหลมเกี่ยวเสื้อทุกก้าว","หมาเฝ้าสุสานรถนอนตายเรียงสามตัว มีคนวางยามันก่อนไซเรนจะดัง"],yard:["ลานรถรอแยกชิ้น รถครึ่งคันห้อยอยู่บนเครน บางคันยังมีเครื่อง บางคันยังมีน้ำมัน","เจ้าของอู่นั่งบนเก้าอี้พลาสติกหน้าห้องแถว ปืนลูกซองพาดตัก มองมาแล้วพยักหน้าช้าๆ"]},
 village:{road:["หมู่บ้านจัดสรร ป้อมยามหน้าหมู่บ้านไฟสว่าง ไม้กั้นยกค้าง รปภ.ไม่อยู่ เหลือแต่เครื่องแบบพับวางไว้บนเก้าอี้","บ้านแบบเดียวกันเรียงเป็นแถวยาว ประตูรั้วทุกหลังสีเดียวกัน หลงได้ง่าย ซ่อนก็ได้ง่าย"],house:["บ้านหลังนี้เปิดไฟทุกดวง ประตูเปิดกว้าง บนโต๊ะมีโน้ต ‘เข้ามาได้ ปลอดภัย’ ลายมือเรียบร้อยเกินไป","ห้องนั่งเล่นมีรูปงานแต่งใบใหญ่ ทั้งคู่ในรูปยิ้ม ทั้งคู่ตัวจริงนั่งอยู่บนโซฟา ไม่ยิ้มแล้ว"]},
 rich:{road:["ถนนหน้าคฤหาสน์ ไฟประดับสวนสว่างเหมือนงานเลี้ยง มีเสียงดนตรีคลาสสิกกับเสียงหัวเราะลอยมา","รั้วเหล็กดัดสูงสามเมตร กล้องวงจรปิดหันตามทุกการเคลื่อนไหว"],house:["คฤหาสน์ประตูเปิดค้าง โถงกลางมีโต๊ะยาวจัดเลี้ยงครบชุด ป้ายชื่อแขกวางทุกที่นั่ง หนึ่งในนั้นเป็นชื่อ ‘เหยื่อ’","ห้องรับแขกติดหัวสัตว์สตัฟฟ์เต็มผนัง ช่องสุดท้ายยังว่าง มีแผ่นทองเหลืองเขียนปีนี้รออยู่"]},
 slum:{road:["ทางเดินไม้กระดานกลางชุมชน บ้านชิดกันจนหลังคาแทบชน คนแอบมองจากทุกช่องไม้","ชาวชุมชนผลัดกันยืนเวรถือไม้ถือมีดที่ปากซอย ไม่ใช่เพื่อฆ่า แต่เพื่อไม่ให้ใครเข้ามาฆ่า"],hall:["ลานเล่นตะกร้อกลางชุมชน ผู้หญิงกับเด็กนอนรวมกันบนเสื่อ ผู้ชายนั่งล้อมวงเฝ้า","มีหม้อข้าวต้มใบใหญ่ตั้งอยู่บนเตาถ่าน ใครผ่านมาก็ตักให้ ไม่ถามชื่อ"]},
 temple:{road:["ลานหน้าศูนย์พักพิงมืดสนิท เต็นท์ทุกหลังปิดไฟ มีแต่ไฟจากโรงยิมที่ยังเปิดอยู่หลังเดียว","หมาจรแถวนั้นเดินตามมาเงียบๆ ไม่เห่า ไม่ขู่ แค่ตามมา"],hall:["ศาลาประชาคม ชาวบ้านมาหลบนั่งเบียดกันเต็มศาลา ผู้ชายผลัดกันเฝ้าประตูด้วยไม้คานกับมีดพร้า","โรงทานข้างศาลายังมีหม้อข้าวต้มอุ่นอยู่บนเตาถ่าน คนแจกยืนถือทัพพีกับมีดไว้ในมือเดียวกัน"],house:["กุฏิ ประตูไม้ปิดสนิท ข้างในมีเสียงคนกระซิบกันหลายเสียง แล้วเงียบกริบตอนได้ยินเสียงเท้า","หน้ากุฏิมีถุงข้าวกล่องกับขวดน้ำวางเรียง มีคนเอามาไว้ให้ใครก็ได้ก่อนไซเรนจะดัง"]},
 cemetery:{house:["ศาลาตั้งศพ โลงสามใบตั้งเรียง ใบหนึ่งฝาเปิด ว่าง ข้างในบุผ้าขาวสะอาด","พวงหรีดเรียงรายล้อมศาลา ชื่อบนริบบิ้นเป็นชื่อคนที่ยังไม่ตาย"],hall:["ลานเมรุ ปล่องควันยังมีควันจางๆ ลอยขึ้นฟ้า ใครบางคนใช้เมรุคืนนี้","มีคนนั่งยองๆ ข้างเมรุ เขี่ยขี้เถ้าด้วยไม้ ฮัมเพลงเบาๆ"]},
 highway:{open:["ไหล่ทางหลวง รถจอดทิ้งเรียงยาวหลายกิโล ไฟฉุกเฉินบางคันยังกะพริบส้มเป็นจังหวะ","ป้ายไฟจราจรเหนือถนนขึ้นข้อความ ‘ขับขี่ปลอดภัย ถึงบ้านโดยสวัสดิภาพ’"],wreck:["รถบัสนักเรียนนอนตะแคงกลางถนน กระจกทุกบานแตก ข้างในว่าง ไม่มีศพสักศพ แปลกกว่ามีศพ","รถเก๋งคันหนึ่งชนแบริเออร์ เครื่องยังติด เพลงยังเปิด คนขับฟุบพวงมาลัย แตรดังยาวไม่หยุด"]},
 street:{open:["ถนนกลางเมือง ป้ายโฆษณายักษ์บนตึกยังฉายโฆษณาน้ำหอม ผู้หญิงในจอหันมายิ้มทุกสิบวินาที","รถเมล์จอดค้างกลางแยก ประตูเปิด กระดิ่งรถดังเป็นระยะ ไม่มีใครลง"],wreck:["ด่านตรวจที่ถูกทิ้ง กรวยจราจรล้มกระจาย เต็นท์ผ้าใบขาด รถสายตรวจไฟไซเรนยังหมุน","ร้านข้างถนนถูกทุบกระจกทุกร้าน เศษกระจกส่องแสงไฟเหมือนดาว"]},
 bridge:{open:["กลางสะพาน ลมแรงจนต้องเกาะราว แม่น้ำข้างล่างดำสนิท ไม่ได้ยินเสียงน้ำเลย","สะพานแคบเหลือเลนเดียว อีกเลนถูกรถจอดขวาง ใครจะข้ามต้องผ่านตรงกลางให้คนเห็น"],shade:["ใต้สะพาน เสียงรถข้างบนดังเป็นระยะทั้งที่คืนนี้ไม่น่ามีรถ มีคนผูกเปลนอนเรียงกันใต้คาน","มีเรือแจวลำเล็กผูกไว้กับเสาตอม่อ ใบพายวางอยู่ในเรือ"]},
 underpass:{shade:["ใต้ทางด่วน คนไร้บ้านก่อกองไฟผิงกันสี่ห้าคน ไม่มีใครหันมา มีคนหนึ่งเลื่อนที่ให้","ภาพกราฟฟิตี้บนตอม่อเป็นรูปคนวิ่งหนี วาดใหม่ทุกปี ปีนี้มีเพิ่มอีกหลายคน"],open:["อุโมงค์ลอดใต้ทางด่วน ไฟสีส้มดับเป็นช่วงๆ ใครยืนอยู่ในช่วงมืดก็มองไม่เห็นจนกว่าจะเดินชน","เสียงก้องในอุโมงค์ทำให้ได้ยินฝีเท้าตัวเองซ้ำสองครั้ง หรืออาจไม่ใช่ของตัวเอง"]},
 alley:{open:["ตรอกร้างแคบยาว สายไฟพันกันระโยงระยางเหนือหัว ไฟห้อยดวงเดียวแกว่งไปมา","ผนังตรอกมีลูกศรพ่นสีบอกทาง ‘ทางรอด →’ ไม่รู้ว่าใครพ่น และพ่นเพื่ออะไร"],shade:["ใต้กันสาดร้านที่ปิดไปแล้ว มีกล่องกระดาษที่เคยเป็นบ้านใครบางคน ข้างในมีหมอนกับรูปถ่าย","มุมตรอกมืดสนิท ได้กลิ่นบุหรี่ มีคนยืนสูบอยู่ในความมืด เห็นแค่จุดไฟแดงขยับขึ้นลง"]},
 station:{open:["ชานชาลา นาฬิกาสถานีหยุดเดินที่หนึ่งทุ่มตรง ป้ายประกาศ ‘ขบวนสุดท้ายออกแล้ว’","ม้านั่งยาวมีคนนั่งรอรถไฟสามสี่คน นั่งตัวตรง กระเป๋าวางบนตัก ไม่มีใครบอกพวกเขาว่าไม่มีรถไฟ"],wreck:["ตู้รถไฟชั้นสามจอดทิ้ง ประตูเลื่อนเปิดๆ ปิดๆ เอง ข้างในพัดลมเพดานยังหมุน","หัวรถจักรเก่าจอดนิ่ง ห้องคนขับมีไฟฉายตกอยู่ ยังเปิดอยู่"]},

const VER=2, SKEY="overtime.save.v2", MKEY="overtime.meta.v1";
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const META_DEF=()=>({v:VER,runs:0,endings:{},kills:0,saved:0,betrayed:0,worldGhosts:[],scars:[],year:13,recent:[],best:null,arrived:0,pts:0,perks:{},stash:[],legacy:null,bestKm:0,seenIntro:0,dn:null,cal:null,dq:null,wkDone:{},ach:{},st:{},title:null,theme:null,themeOn:0,sureUp:0,instNo:0});
function migrateMeta(m){
 if(!m) return META_DEF();
 const d=META_DEF(); for(const k in d) if(m[k]===undefined) m[k]=d[k];
 if(m.v!==VER){ const ne={};
  for(const key in m.endings){ if(key.includes(":")){ne[key]=m.endings[key];continue;}
   const [cat,title]=key.split("|"); const i=(OLD_TITLES[cat]||[]).indexOf(title); if(i>=0) ne[cat+":"+i]={first:(m.endings[key]&&m.endings[key].first)||Date.now()}; }
  m.endings=ne; m.v=VER; }
 return m;
}

const _rnd=Math.random;
function _mb(x){let a=x|0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return [a,((t^(t>>>14))>>>0)/4294967296]}
Math.random=function(){if(dnRS!=null){const [a,v]=_mb(dnRS);dnRS=a;return v}if(G&&G.dn&&G.rs!=null&&!G.over){const [a,v]=_mb(G.rs);G.rs=a;return v}return _rnd()};

function startDaily(g){const D=dnInfo();if(D.date===otToday()&&D.played)return;if(load(SKEY_D,null))return resumeRun(SKEY_D);
 dnRS=dnSeed(otToday()+g);newRun(g,false,{daily:1});track("/daily/start")}
function dailyBtnH(can){const D=dnInfo(),ds=load(SKEY_D,null);
 if(ds&&ds.v===VER&&!ds.over)return `<button class="btn primary" onclick="resumeRun('${SKEY_D}')">🌙 เล่นคืนประจำวันต่อ</button>`;
 if(D.date===otToday()&&D.played)return `<button class="btn" disabled>🌙 คืนประจำวัน: เล่นแล้ววันนี้ · ${D.res.txt}<div class="cost">รอบใหม่เปิดหลังเที่ยงคืน</div></button>`;
 return `<div class="grid2"><button class="btn ${can?"":"primary"}" onclick="startDaily('m')">🌙 คืนประจำวัน ♂</button><button class="btn ${can?"":"primary"}" onclick="startDaily('f')">🌙 คืนประจำวัน ♀</button></div><div class="small" style="margin:-4px 0 8px">ทุกคนที่เลือกเพศเดียวกันเจอคืนเดียวกัน · เล่นจริงได้วันละครั้ง · ไม่ใช้สิ่งที่ติดตัวข้ามปี · ได้แต้มโบนัส</div>`}

/* --- ภารกิจรายวัน (นับจากผลของแต่ละคืน) --- */

 {id:"walk",t:"ถึงบ้านด้วยการเดินเท้า",n:1,f:g=>g.ending.arrived&&g.veh==="เดินเท้า"?1:0},
 {id:"help",t:"ช่วยคนรวม 3 คน",n:3,f:g=>g.helped||0},
 {id:"nokill",t:"ถึงบ้านโดยไม่ฆ่าใคร",n:1,f:g=>g.ending.arrived&&!g.kills?1:0},
 {id:"kill",t:"ล้มศัตรูรวม 4 คน",n:4,f:g=>g.kills||0},
 {id:"newend",t:"ปลดล็อกฉากจบใหม่ 1 อัน",n:1,f:g=>g.ending.isNew?1:0},
 {id:"km",t:"เดินทางรวม 80 กม.",n:80,f:g=>g.map&&g.mode==="run"?Math.max(0,Math.round(g.map.km-kmLeft())):0},

 {id:"hunt",t:"เล่นโหมดออกล่า 1 คืน",n:1,f:g=>g.mode==="hunt"?1:0,ok:()=>huntOpen()},
 {id:"home",t:"เล่นโหมดเฝ้าบ้าน 1 คืน",n:1,f:g=>g.mode==="home"?1:0,ok:()=>homeOpen()}];
const DQ_EACH=8,DQ_ALL=12;
function dqInfo(){const d=otToday();if(!META.dq||META.dq.date!==d){const pool=OTQ.filter(q=>!q.ok||q.ok());let h=dnSeed("q"+d);const ids=[];
  while(ids.length<3&&ids.length<pool.length){h=(Math.imul(h,1103515245)+12345)>>>0;const q=pool[h%pool.length].id;if(!ids.includes(q))ids.push(q)}
  META.dq={date:d,ids,prog:{},done:[],bonus:0}}return META.dq}

/* --- ปฏิทิน 30 วัน --- */
const CAL_GIFT={7:{t:"🩸 +40 แต้ม + ฉายา “คนที่กลับบ้านทุกปี”",f:()=>{META.pts+=40;META.title="คนที่กลับบ้านทุกปี"}},
 14:{t:"🎟️ ใบแลกสิ่งที่ติดตัวฟรี 1 ใบ",f:()=>{META.sureUp=(META.sureUp||0)+1}},
 21:{t:"🩸 +80 แต้ม",f:()=>{META.pts+=80}},
 30:{t:"🌅 ธีมฟ้ารุ่งสาง + ฉายา “รอดมาสามสิบคืน” + 🩸 150 แต้ม",f:()=>{META.theme="dawn";META.themeOn=1;META.title="รอดมาสามสิบคืน";META.pts+=150}}};
function calN(){return META.cal?META.cal.days.length:0}
function calMark(ex){META.cal=META.cal||{days:[]};const d=otToday();if(META.cal.days.includes(d))return;META.cal.days.push(d);const n=META.cal.days.length;
 const p=n>30?6:5+Math.ceil(n/3);META.pts+=p;let t=`📅 ปฏิทินวันที่ ${n}: +${p} แต้ม`;const g=CAL_GIFT[n];if(g){g.f();t+=" · "+g.t}ex.push(t);track("/cal/"+n);applyTheme()}
function applyTheme(){try{document.body.classList.toggle("dawnth",!!(META.theme==="dawn"&&META.themeOn))}catch(e){}}
function toggleTheme(){META.themeOn=META.themeOn?0:1;saveMeta();applyTheme();renderDaily()}

/* --- กฎประจำสัปดาห์ (หมุนจาก YEAR_RULES ที่มีอยู่) --- */
const WK_REWARD=40;
function wkIndex(){const t=new Date();const days=Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5);return Math.floor((days+3)/7)}
function wkRule(){return YEAR_RULES[wkIndex()%YEAR_RULES.length]}
function wkDoneNow(){return !!(META.wkDone&&META.wkDone[wkIndex()])}

const ACH_PTS=5;
function checkOtAch(g,ex){let n=0;for(const [id,i,t,d,f] of OTACH){if(META.ach[id])continue;let ok=false;try{ok=f(g)}catch(e){}if(ok){META.ach[id]=Date.now();META.pts+=ACH_PTS;n++;
 if(ex)ex.push(`${i} Achievement “${t}” +${ACH_PTS} แต้ม`);else otPop(i+" "+t,d+" · +"+ACH_PTS+" แต้ม")}}if(n)saveMeta()}

/* --- รวมทุกอย่างตอนจบคืน --- */
function retEnd(){const g=G,ex=g.ending.extra;META.st=META.st||{};
 if(g.flags.ms&&g.flags.ms.length){const p=g.flags.ms.length*3;META.pts+=p;ex.push(`🛣️ ผ่านหลักระยะทาง ${g.flags.ms.length}/3 +${p} แต้ม`)}
 if(g.mode==="run"&&g.map){const km=Math.max(0,Math.round(g.map.km-kmLeft()));g.ending.km=km;g.ending.bestPrev=META.bestKm||0;if(km>(META.bestKm||0))META.bestKm=km}
 if(g.wkr!=null)ex.push("🔮 กฎประจำสัปดาห์: แต้มรอด ×2");
 if(g.dn){const D=dnInfo();const km=g.map&&g.mode==="run"?Math.max(0,Math.round(g.map.km-kmLeft())):0;const b=10+Math.round(km/5)+(g.ending.arrived?25:0);
  META.pts+=b;D.date=g.dn;D.played=1;D.res={km,arrived:g.ending.arrived,alive:g.ending.alive,txt:g.ending.arrived?"ถึงบ้าน":g.ending.alive?`รอด · ไป ${km} กม.`:`ไป ${km} กม.`};
  D.hist=(D.hist||[]).concat([{d:g.dn,km,a:g.ending.arrived}]).slice(-30);META.st.dnCount=(META.st.dnCount||0)+1;ex.push(`🌙 คืนประจำวัน +${b} แต้ม`);track("/daily/end")}
 if(g.wkr!=null&&g.ending.arrived&&g.wkr===wkIndex()&&!wkDoneNow()){META.wkDone[wkIndex()]=1;META.st.wk=META.st.wk||{};META.st.wk[YEAR_RULES.indexOf(wkRule())]=1;META.pts+=WK_REWARD;ex.push(`🔮 ถึงบ้านภายใต้กฎประจำสัปดาห์ +${WK_REWARD} แต้ม`)}
 const Q=dqInfo();for(const id of Q.ids){if(Q.done.includes(id))continue;const q=OTQ.find(x=>x.id===id);Q.prog[id]=(Q.prog[id]||0)+q.f(g);
  if(Q.prog[id]>=q.n){Q.done.push(id);META.pts+=DQ_EACH;ex.push(`✅ ภารกิจ “${q.t}” +${DQ_EACH} แต้ม`)}}
 if(Q.done.length===Q.ids.length&&!Q.bonus){Q.bonus=1;META.pts+=DQ_ALL;META.st.dqAll=(META.st.dqAll||0)+1;ex.push(`🎉 ภารกิจครบวันนี้ +${DQ_ALL} แต้ม`)}
 calMark(ex);checkOtAch(g,ex)}

/* --- เป้าหมายถัดไปบนหน้าแรก --- */
function nextGoals(){const g=[];const D=dnInfo();
 if(!(D.date===otToday()&&D.played))g.push(["🌙","คืนประจำวันของวันนี้ยังไม่ได้เล่น · ได้แต้มโบนัส"]);
 if(!wkDoneNow())g.push(["🔮",`กฎสัปดาห์นี้ “${wkRule().t}”: ถึงบ้านให้ได้ รับ +${WK_REWARD} แต้ม`]);
 if(!homeOpen())g.push(["🏠",`อีก ${3-META.runs} คืน ปลดล็อกโหมดเฝ้าบ้าน`]);
 else if(!huntOpen())g.push(["🩸","ได้ฉากจบหมวด “กลายเป็นนักล่า” สักอัน เพื่อปลดโหมดออกล่า"]);
 const nx=Object.entries(PERKS).map(([k,p])=>({p,c:p.c[pk(k)]})).filter(x=>x.c!=null).sort((a,b)=>a.c-b.c)[0];
 if(nx)g.push(["🧬",META.pts>=nx.c?`แต้มพอแลก ${nx.p.n} แล้ว`:`อีก ${nx.c-META.pts} แต้ม แลก ${nx.p.n}`]);
 let best=null;for(const a of OTACH){if(META.ach[a[0]]||!a[5])continue;try{const [x,y]=a[5]();const r=x/y;if(r<1&&(!best||r>best.r))best={a,r,x,y}}catch(e){}}
 if(best)g.push([best.a[1],`${best.a[2]}: ${Math.min(best.x,best.y)}/${best.y}`]);
 return g.slice(0,3)}
function goalH(){const g=nextGoals();return g.length?`<div class="panel"><b>เป้าหมายถัดไป</b>${g.map(([i,t])=>`<div class="small" style="color:var(--ink);margin-top:6px">${i} ${t}</div>`).join("")}</div>`:""}

 const w=wkRule();
 app.innerHTML=`<div class="scr"><h2>📅 วันนี้ในคืนไร้กฎ</h2>
 <div class="panel"><b>🔮 กฎประจำสัปดาห์: ${w.t}</b><div class="small" style="margin-top:4px">เลือกได้ตอนเริ่มคืนใหม่ · แต้มรอด ×2 · ถึงบ้านครั้งแรกในสัปดาห์ได้ +${WK_REWARD} แต้ม · เปลี่ยนทุกวันจันทร์</div>${wkDoneNow()?`<div class="small" style="color:var(--green)">ผ่านแล้วสัปดาห์นี้ ✅</div>`:""}</div>
 <div class="panel"><b>ภารกิจวันนี้</b><div class="small">เปลี่ยนทุกเที่ยงคืน · ข้อละ +${DQ_EACH} แต้ม · ครบ 3 ข้อ +${DQ_ALL}</div>
 ${Q.ids.map(id=>{const q=OTQ.find(x=>x.id===id),v=Math.min(Q.prog[id]||0,q.n),d=Q.done.includes(id);return `<div class="ach"><div class="ai">${d?"✅":"⬜"}</div><div style="flex:1"><b style="font-size:14px">${q.t}</b><div class="prog"><i style="width:${v/q.n*100}%"></i></div><span class="small">${v}/${q.n}</span></div></div>`}).join("")}</div>
 <div class="panel"><b>📅 ปฏิทิน ${n}/30</b><div class="small">จบอย่างน้อย 1 คืนในวันนั้น = นับ 1 วัน ไม่ต้องติดกัน ขาดได้ไม่รีเซ็ต · ทุกวันได้แต้ม</div><div class="cal">${cells}</div>
 <div class="small" style="margin-top:8px">${Object.entries(CAL_GIFT).map(([d,g])=>`${n>=d?"✅":"🎁"} วันที่ ${d}: ${g.t}`).join("<br>")}</div>

function genMap(km,startPlace){
 const L=clamp(Math.round(km/10),3,12), nodes=[], edges=[], layers=[];
 const pool=PKEYS.filter(k=>k!=="drain");
 for(let l=0;l<=L;l++){
  const n=(l===0||l===L)?1:ri(2,4), arr=[];
  for(let i=0;i<n;i++){ const id=nodes.length;
   let p=l===0?startPlace:l===L?"home":pick(pool);
   if(l>0&&l<L&&chance(.05)) p="drain";
   if(l===L-1&&["rich","police"].includes(p)) p=pick(["village","shophouse","flat","street","slum"]);
   nodes.push({id,l,x:clamp((i+1)/(n+1)+rnd(-.05,.05),.08,.92),p,loot:100,boat:p==="pier"&&chance(.75)}); arr.push(id); }
  layers.push(arr);
 }
 const kmF=km/L, has=(a,b)=>edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a));
 const add=(a,b,t,k)=>{ if(a===b||has(a,b))return; const T=ETYPES[t]; edges.push({a,b,t,km:Math.max(1,Math.round((k||kmF)*(T.short||1)*rnd(.9,1.1))),blocked:false}); };
 const near=(a,arr)=>arr.slice().sort((p,q)=>Math.abs(nodes[p].x-nodes[a].x)-Math.abs(nodes[q].x-nodes[a].x));
 for(let l=0;l<L;l++){ const A=layers[l],B=layers[l+1];
  A.forEach(a=>{ const nb=near(a,B); add(a,nb[0],chance(.6)?"road":"soi");
   if(nb[1]!=null&&chance(.6)){ const na=nodes[a]; let t=pick(["road","soi","hwy","hwy","rail","sewer"]);
    if(na.p==="pier") t="canal"; else if(na.p==="drain") t="sewer"; else if(na.p==="station") t="rail"; else if(na.p==="highway") t="hwy";
    add(a,nb[1],t); }
   if(nodes[a].p==="pier"&&nb.length===1){ /* single target: canal parallel not possible */ }
  });
  B.forEach(b=>{ if(!edges.some(e=>e.b===b&&nodes[e.a].l===l)) add(near(b,A)[0],b,"road"); });
  if(A.length>1) for(let i=0;i<A.length-1;i++) if(chance(.45)) add(A[i],A[i+1],"soi",rnd(2,4));
 }
 return {L,nodes,edges,km};
}
const adj=id=>G.map.edges.filter(e=>e.a===id||e.b===id).map(e=>({e,to:e.a===id?e.b:e.a}));
function bfs(from,to){ const prev={[from]:-1},q=[from]; while(q.length){ const c=q.shift(); if(c===to)break; adj(c).forEach(x=>{ if(!(x.to in prev)){prev[x.to]=c;q.push(x.to);} }); }
 if(!(to in prev)) return null; const path=[]; let c=to; while(c!==-1){path.unshift(c);c=prev[c];} return path; }
const kmLeft=id=>{ const n=node(id); return Math.round(G.map.km*(G.map.L-n.l)/G.map.L); };
function travelInfo(x){ // x:{e,to}
 const e=x.e, T=ETYPES[e.t], V=VEHS[G.veh], n=node(x.to), cur=node();

function areaOf(n){ n=n||node(); const k=AREA_OF[n.p]||"road", nm=SPOT_N[n.p]||{}, dd=SPOT_D[n.p]||{}, sg=SIG[n.p]||{};

function spState(id,nid){ nid=nid==null?G.at:nid; G.spx=G.spx||{}; const a=G.spx[nid]=G.spx[nid]||{}; return a[id]=a[id]||{l:100,u:{},v:0}; }
function curSpot(){ const A=areaOf(); let sp=A.find(x=>x.id===G.spot); if(!sp){ sp=A[0]; G.spot=sp.id; } return sp; }
function entrySpot(n,etype){ const A=areaOf(n), t=ETAG[etype]; return (A.find(x=>x.ex.includes(t)&&!x.sn)||A.find(x=>x.ex.includes(t))||A[0]).id; }
function exitsAt(sp){ const A=areaOf(); return allRoutes().filter(o=>{ const t=ETAG[o.e.t]; const at=A.filter(x=>x.ex.includes(t)); return at.length?at.some(x=>x.id===sp.id):sp.id===A[0].id; }); }

 if(fx.trapHunter){ G.hunter.stun+=4; G.hunter.hurt=true; }
 if(fx.drug) takeDrug();
 if(fx.rob){ G.money=Math.floor(G.money*.4); const c=G.inv.filter(x=>x!==G.weapon); if(c.length){ const it=pick(c); G.inv.splice(G.inv.indexOf(it),1); addLog("โดนเอา"+it+"ไป","bad"); } addLog("โดนปล้นเงิน","bad"); }

 if(fx.ride||fx.skip){ let n=fx.ride||fx.skip, cur=G.at, steps=0; while(n-->0){ const f=adj(cur).filter(x=>node(x.to).l>node(cur).l&&x.to!==G.homeId); if(!f.length)break; cur=pick(f).to; steps++; }

 if(fx.min) passTime(fx.min);
 if(fx.fight) d.fight=fx.fight; if(fx.capture) d.capture=fx.capture; if(fx.end) d.end=fx.end;

function startCombat(key,opts){

 const ph=phase().k, mul=(opts.hpMul||1)*(ph==="hell"?1.12:ph==="dawn"?1.2:1)*(G.noMercy?1.15:1)*(G.mode==="hunt"?1.2:G.mode==="home"?1.25:1);
 if(WEAPONS[G.weapon].gun&&G.ammo<=0){ const m=G.inv.filter(x=>WEAPONS[x]&&!WEAPONS[x].gun&&!WEAPONS[x].throw).sort((a,b)=>WEAPONS[b].dmg-WEAPONS[a].dmg)[0]; G.weapon=m||"มือเปล่า"; }
 const unit=base.hp*mul*.9;
 G._c={key,name:opts.name||base.name,unit,hp:unit*(1+(count-1)*.75),hp0:unit*(1+(count-1)*.75),dmg:base.dmg*(ph==="dawn"?1.1:1)*(G.noMercy?1.1:1)*(G.mode==="hunt"?1.25:G.mode==="home"?1.1:1),gun:opts.gun||base.gun,flee:base.flee,count,
  range:opts.range!=null?opts.range:(opts.gun||base.gun)?(chance(.5)?2:1):(chance(.5)?1:0),onWin:opts.onWin,onWinFx:opts.onWinFx,deathEnd:opts.deathEnd,round:0,htype:opts.htype,traitor:opts.traitor};
 const dsc=opts.desc||pick([base.desc].concat(FOE_DESC[key]||[]));
 combatScreen(`${G._c.name}${count>1?` ${count} คน`:""}\n${dsc}`,true);
}
function alive(){ const e=G._c; return Math.max(1,Math.ceil(e.hp/e.unit-.001)); }
function hpWord(){ const e=G._c, r=e.hp/e.hp0; return (e.count>1?`เหลือ ${alive()} จาก ${e.count} • `:"")+(r>.66?"ยังไม่เป็นอะไร":r>.33?"เริ่มเซ มีเลือด":"ยืนแทบไม่อยู่"); }
function wdmg(){ return wdmg0()*1.12; }
function wdmg0(){ const w=WEAPONS[G.weapon]; let d=(G.weapon==="มือเปล่า"&&G.job.fist)||w.dmg; if(G.weapon==="มือเปล่า"&&G.flags.wrap) d*=1.6; if(!w.gun&&!w.throw){ d*=1+sk("force")*.08; if(w.dmg>=13&&w.dmg<=48&&/มีด|ขวาน|กรรไกร|คัตเตอร์|ตะขอ/.test(G.weapon)) d*=1+sk("blade")*.12; } if(G.trait.id==="reckless")d*=1.15; if(G.flags.adrenaline)d*=1.12; return d; }

 let dmg=e.dmg*(1+(alive()-1)*.32)*rnd(.8,1.2)*mult*nbF(); if(e.legged)dmg*=.6;

 if(chance(.13)){ const inj=pick(["bleed","bleed","leg","arm"]); if(inj==="bleed"){G.bleed+=2;addLog("แผลลึก เลือดไหลไม่หยุด","bad");} else if(inj==="leg"&&!G.legHurt){G.legHurt=true;addLog("ขาเจ็บหนัก","bad");} else if(inj==="arm"&&!G.armHurt){G.armHurt=true;addLog("มือเจ็บ จับอาวุธไม่ถนัด","bad");} }
 if(G.hp<=0&&G.partner&&!G.partner.secretBad&&G.partner.bond>=2&&chance(.6)){ G.hp=24; G.flags.partnerDied=G.partner.name; G.partner=null; G.sanity=clamp(G.sanity-22,0,100);
  return combatScreen("วินาทีที่ควรจะจบ มีคนพุ่งเข้ามาขวาง เขาล้มลงแทน"+me()+" ไม่มีเวลาแม้แต่จะเรียกชื่อ มันยังยืนอยู่ตรงหน้า",true); }
 if(G.hp<=0){ if(!G.flags.lastStand&&!G._homeFight&&!e.deathEnd) return lastStand(); return combatLose(); }

function combatWin(){
 const e=G._c; const k=Math.max(1,alive()); G.kills+=k; META.kills+=k; if(G.mode==="hunt"&&e.key!=="dogs"&&!e.onWin) G.bounty+=120*k; G.karma-=1; killSanity(); if(G.kills>=6)G.flags.hunterPath=true;
 let loot=[]; if(chance(.5)){const m=ri(80,450);G.money+=m;loot.push(`เงิน ${m}`);} if(e.gun&&chance(.6)){const a=ri(1,4);G.ammo+=a;loot.push(`กระสุน ${a}`); if(chance(.4)){const r=giveItem("ปืนพก"); if(r)loot.push(r);} }

 if((e.key==="mask"||e.key==="cult")&&chance(.4)){ const m=e.key==="mask"?"หน้ากากยักษ์":"ชุดขาวผู้ชำระ"; if(!G.masks.includes(m)){G.masks.push(m);loot.push(m);} }

}
function endCombat(won,text,fled){
 const e=G._c; G._c=null; passTime(10);
 const d=won&&e.onWinFx?applyFx(e.onWinFx):{};
 if(G._homeFight){ const hf=G._homeFight; G._homeFight=null; return toast(won?"จบ":"รอด",text,()=>hf(won)); }
 toast(won?"รอดมาได้":fled?"หนีรอด":"มันถอยไป",text,()=>{ if(G.hp<=0) return flow(); if(won&&e.onWin) return fnOf(e.onWin)(); after(d); });
}
function combatLose(){
 const e=G._c; G._c=null;
 if(G._homeFight){ G._homeFight=null; return finishEnding(["raided",2]); }
 if(e.deathEnd) return finishEnding(e.deathEnd);
 if(G.mode==="home") return finishEnding(homeDeath(e));
 if(G.mode==="hunt"){ G._foe=e; return finishEnding(huntDeath(e)); }
 if(!G.flags.captured&&["mask","cult","hunter","tourist"].includes(e.key)&&chance(e.key==="hunter"||e.key==="tourist"?(e.htype==="streamer"?.55:.14):.3)) return captureScene(e.key);
 if(!G.flags.captured&&["robber","state","worker","punk"].includes(e.key)&&chance(.24)) return clinicScene("fight");
 G._foe=e; finishEnding(deathByFoe(e));
}
// ตายแบบไหน ขึ้นกับว่าใครฆ่า อยู่ที่ไหน และสภาพร่างกาย (ไม่ไหลไปฉากเดียวกันหมด)
function deathByFoe(e){
 const p=node().p, c=[];
 if(["pier","canal"].includes(p)||G._lastEdge==="canal") c.push(4,4);
 if(G.bleed>0) c.push(p==="bridge"?0:0);
 if(G.infection>0) c.push(5);
 if(G.drugAddict>0||G.flags.adrenaline) c.push(8);
 if(G.stamina<15) c.push(7);
 const k=e&&e.key, ht=e&&e.htype;
 if(ht==="driver"||k==="punk") c.push(1,1);
 else if(ht==="blade"||((k==="mask"||k==="cult"||k==="dogs")&&e.count>1)) c.push(2,2);
 else if(ht==="sniper"||ht==="pair"||k==="state"||k==="tourist"||(e&&e.gun&&k!=="hunter")) c.push(3,3);
 else if(k==="hunter") c.push(3,9);
 if(e&&e.traitor) c.push(6,6);
 if(k==="robber"||k==="worker") c.push(9,2);
 if(!c.length) c.push(9,3,2);
 const un=c.filter(i=>!META.endings["dead:"+i]);
 return ["dead",pick(un.length&&chance(.6)?un:c)];
}

function huntEncounter(){
 G.flags.huntN=(G.flags.huntN||0)+1;
 if(G.threat>=68&&!G.flags.homeAlarm&&G.phoneBat>0) return huntHomeAlarm();
 if(META.legacy&&!G.flags.metLegacy&&G.min>200&&chance(.35)) return huntLegacy();
 const r=Math.random();
 if(r<.12&&!G.flags.rivalMet) return huntRival();
 if(r<.17&&!G.flags.stateMet&&G.min>180){ G.flags.stateMet=true; return toast("🪖 หน่วยชุดดำ","ไฟสปอตไลต์สาดลงมาจากรถหุ้มเกราะ “อาวุธในมือ วางลง” แต่ไม่รอให้วาง",()=>startCombat("state",{count:2,desc:"หน่วยชุดดำไม่สนว่าใครล่าใคร"})); }
 if(r<.22&&!G.flags.baitMet) return huntBait();
 const pool=TARGETS.filter(t=>!(G.flags.tUsed||{})[t.n]); const T=pick(pool.length?pool:TARGETS); (G.flags.tUsed=G.flags.tUsed||{})[T.n]=1;
 huntTarget(T);
}

function huntEnd(where){

  if(!G.sisterSafe||(f.homeAlarm&&!f.rushHome&&!f.wHidden&&chance(.5))) return finishEnding(["hfall",9]); }
 if(f.sparedSelf) return finishEnding(["hmercy",3]);
 if(f.killedKnown&&chance(.6)) return finishEnding(["hfall",6]);
 if(G.kills===0){
  r=pickUnseen("hmercy",[home&&f.escorted?1:-1,(G.helped>=3)?4:-1,home?9:-1,7,home&&G.sanity<45?6:-1,home?0:-1,G.money>=4000?8:-1]);
  if(G.money>=4000&&r&&r[1]===8) G.money=0; return finishEnding(r); }
 if((f.spared||0)>=2&&G.kills<=1&&chance(.5)) return finishEnding(["hfall",5]);
 if(club) r=pickUnseen("hwin",[b>=3000?0:-1,b>=1800?1:-1,(f.live||0)>=2?4:-1,f.killedRival?5:-1,!(f.live)?8:-1,G.kills>=4&&G.masks.length?3:-1,(f.live||0)<2?8:-1,G.kills>=3?3:-1]);
 else if(home) r=pickUnseen("hwin",[b>=600?2:-1,G.kills>=4?3:-1,b<600?6:-1,G.kills>=5&&chance(.4)?9:-1]);
 else r=pickUnseen("hwin",[6,!(f.live)&&G.kills>=2?8:-1,G.kills>=4?9:-1,G.kills>=3&&G.masks.length?3:-1]);
 finishEnding(r||["hwin",6]);
}
function huntDeath(e){

}

 show({loc:"🚐 หน้าบ้าน",ic:"⛓️",flash:2,text:`รถตู้ไม่ติดป้ายจอดหน้าบ้าน ประตูเลื่อนเปิด ${W}ถูกลากลงมา มือถูกมัด ปากถูกปิดเทป มีปืนจ่อหัว\n\nเสียงตะโกนจากข้างนอก “เปิดประตู แล้วเอาของมีค่าทั้งหมดออกมา แลกกัน”`,k:"card",timer:window.__BOT?0:12,onTimeout:()=>{ G.flags.hostageLost=true; G.tr.fate="dead"; toast("ไม่ตอบ","รอไม่นาน รถตู้ก็ปิดประตู แล้วขับออกไปพร้อม"+G.w.n); },choices:[
  {l:"🔓 เปิดประตู แลกทุกอย่าง",k:"card",go:()=>{ G.flags.hostageTrade=true; G.money=0; G.inv=G.inv.filter(x=>WEAPONS[x]); G.trIn=true; G.comps.push({name:W,intro:"",motive:"จริงใจ",loyalty:100,hp:40,tr:true}); toast("แลกแล้ว","พวกมันขนของไปทุกอย่างที่ขนได้ ถีบ"+G.w.n+"เข้ามาในบ้าน แล้วขับออกไปหัวเราะ บ้านโล่ง แต่คนครบ"); }},
  (WEAPONS[G.weapon].gun&&G.ammo>0)?{l:"🔫 ยิงจากหน้าต่างชั้นสอง",p:pOf(.45,"gun"),k:"card",go:()=>{ G.ammo--; if(chance(pOf(.45,"gun"))){ G.kills++; G.trIn=true; G.flags.fought=true; G.comps.push({name:W,intro:"",motive:"จริงใจ",loyalty:100,hp:45,tr:true}); return toast("ยิงถูก","คนที่ถือปืนจ่อหัวล้มลง ที่เหลือแตกฮือขึ้นรถหนี "+G.w.n+"คลานมาถึงประตูบ้าน"); } G.flags.hostageLost=true; G.tr.fate="dead"; toast("พลาด","กระสุนพลาด เสียงปืนนัดที่สองดังจากข้างล่าง ไม่ใช่ของเรา"); }}:null,
  {l:"🔒 ไม่เปิด อาจเป็นกับดัก",k:"card",go:()=>{ G.flags.hostageLost=true; G.tr.fate="dead"; G.sanity=clamp(G.sanity+sanFx(-25),0,100); toast("ไม่เปิด","รถตู้ปิดประตู ขับออกไปช้าๆ ก่อนพ้นซอย"+G.w.n+"หันมามองบ้านผ่านกระจกหลังเป็นครั้งสุดท้าย"); }}]}); }
function homeChatSend(kind){ const T=TRAV[G.w.tone], tr=G.tr, dead=(tr.fate==="dead"&&G.min>=tr.deadAt)||G.flags.hostageLost, fake=tr.fate==="impostor"&&G.min>=tr.fakeAt-130;
 if(G.rule.noSignal&&chance(.4)){ pushChat("me","(ส่งไม่ออก ไม่มีสัญญาณ)"); return; } G.phoneBat=clamp(G.phoneBat-1,0,100);
 const say={where:"ถึงไหนแล้ว ปลอดภัยไหม",code:"รหัสลับเราคือเลขอะไร",adv:"อย่าผ่านสะพาน อ้อมไปทางคลอง ได้ยินว่าแก๊งยึดสะพานไว้",cheer:"อดทนไว้ ทางนี้รออยู่ ไม่หลับแน่นอน"}[kind]; pushChat("me",say);
 if(dead) return later(()=>pushChat("me","(ส่งแล้ว ยังไม่อ่าน)"));
 later(()=>{ if(kind==="where") pushChat("them",fake?pick(T.fake):`อีกประมาณ ${Math.max(3,Math.round(tr.km*(1-G.min/(tr.fate==="arrive"?tr.arriveAt:760))))} โล`,true);
  else if(kind==="code"){ G.flags.codeInChat=true; pushChat("them",fake?String((G.secretCode+ri(11,88))%900+100):String(G.secretCode),true); }
  else if(kind==="adv"){ if(!G.flags.advised){ G.flags.advised=true; if(tr.fate==="dead"&&G.min<tr.deadAt-30&&chance(.45)){ tr.fate="arrive"; tr.arriveAt=clamp(G.min+ri(150,260),G.min+60,690); G.tl=G.tl.filter(x=>x[2]!=="last"&&x[0]<=G.min); G.hev.push({t:tr.arriveAt,type:"arrive"}); G.hev.sort((a,b)=>a.t-b.t); } } pushChat("them",fake?"ครับ ขอบคุณครับ":pick(["โอเค จะอ้อมไป ขอบใจนะ","ดีที่บอก เมื่อกี้กำลังจะไปทางนั้นพอดี"]),true); }
  else pushChat("them",fake?"ครับ":pick(["ไม่ต้องห่วง","ขอบคุณที่รอนะ","อีกนิดเดียว"]),true); }); }
function homeDeath(e){ const f=G.flags;
 if(G._homeBetray) return ["dfall",6];
 if(f.openedFake) return ["ddoor",1];
 if(f.foundAttic&&G.room==="attic") return ["dfall",1];
 if(f.fireHurt&&chance(.6)) return ["dfall",2];
 if(f.marked&&chance(.5)) return ["dfall",8];
 if(G.lights&&chance(.4)) return ["dfall",3];
 if(f.breached==="b") return ["dfall",chance(.5)?0:5];
 if(G.stamina<10) return ["dfall",7];
 return ["dfall",pick([0,5,8])];
}
function homeDawn(){ const f=G.flags, tr=G.tr, inside=G.comps.some(c=>c.tr), gl=G.comps.filter(c=>!c.tr&&!c.dog&&!c.traitor).length; let r;
 G.arrived=true;
 if(f.hostageTrade) return finishEnding(["ddoor",6]);
 if(inside){ r=pickUnseen("dhome",[0,f.codeChecked?4:-1,gl>=1?8:-1,f.fought||G.kills>=2?6:-1]); return finishEnding(r); }
 if(G.trIn) return finishEnding(["dfall",4]);
 if(f.refusedReal) return finishEnding(["ddoor",2]);
 if(f.fakeRefused) return finishEnding(["ddoor",0]);
 if(f.fakeBeaten||f.hostageLost||tr.fate==="dead") return finishEnding(chance(.75)?["dfall",4]:["dfall",9]);
 const opts=[]; if((f.sheltered||0)>=2) opts.push(["ddoor",9]); if(f.grudgeAlly) opts.push(["ddoor",5]); if(f.grudgeTruce) opts.push(["ddoor",4]); if(f.sentMeds) opts.push(["ddoor",7]); if(f.sheltered) opts.push(["ddoor",3],["dhome",2]);
 if(f.savedNeighbor) opts.push(["dhome",7]); if(f.roof) opts.push(["dhome",5]); if(!f.breached&&G.house.f>=3&&G.house.b>=3) opts.push(["dhome",1]); if(G.kills>=2) opts.push(["dhome",6]);
 opts.push(["dhome",3],["dhome",9]);
 const un=opts.filter(o=>!META.endings[o[0]+":"+o[1]]); finishEnding(pick(un.length&&chance(.75)?un:opts));
}

function hudHome(){
 const ph=phase(), tleft=Math.max(0,720-G.min), full=clamp(Math.ceil(G.hp/G.hpMax*5),0,5), hs="❤️".repeat(full)+"🖤".repeat(5-full), W=WEAPONS[G.weapon], st=[];
 if(G.bleed) st.push("🩸 เลือดไหล ต้องทำแผล"); if(G.stamina<25) st.push("😮‍💨 เหนื่อยมาก"); if(G.sanity<35) st.push("😵 สติจะหลุด"); if(G.phoneBat<=10) st.push(G.phoneBat<=0?"📵 มือถือดับ":"🪫 แบตใกล้หมด"); if(G.lights) st.push("💡 ไฟเปิด มองเห็นจากถนน");
 const last=G.chatlog.filter(m=>m.side==="them").slice(-1)[0], inside=G.comps.some(c=>c.tr);
 return `<div class="hud"><div class="hud-top"><span class="clock">🕐 ${hhmm(Math.max(0,G.min))}</span><span class="small">อีก ${Math.floor(tleft/60)} ชม. ${Math.round(tleft%60)} น. ฟ้าสาง</span><span class="night-badge ${ph.cls}">${ph.label}</span></div>
 <div class="road"><div class="road-fill" style="width:${clamp(G.min/720*100,0,100)}%"></div><span class="road-km">${inside?"🏠 "+G.w.n+"อยู่ในบ้านแล้ว":"📱 "+G.w.n+": "+(last?(last.txt.length>26?last.txt.slice(0,26)+"…":last.txt)+" ("+last.t+")":"ยังไม่มีข่าว")}</span></div>
 <div class="hud-row"><span class="hearts"><img class="hudpt" src="${portrait(G)}" alt="">${heartsH(full)}</span><span class="gear"><span>🏠 ${HROOMS[G.room].n}</span><span>${itemIc(G.weapon)} ${G.weapon}${W.gun?` ×${G.ammo}`:""}</span></span></div>
 ${st.length?`<div class="status">${st.map(x=>`<span>${x}</span>`).join("")}</div>`:""}${G.mode==="run"?todoH():""}</div>`;
}

window.runBot=function(n,smart){ window.__BOT=true; const out={ends:{},err:[],stuck:0,arr:0,alive:0,n};
 for(let r=0;r<n;r++){ try{ newRun(chance(.5)?"m":"f",false); window.__prep(); let st=0;
   while(!G.over&&st++<900){ const cs=UI.choices.filter(c=>!c.dis); if(!cs.length){out.stuck++;out.err.push("nochoice:"+UI.scene);break;}
    if(st%9===4&&G.phoneBat>0) chatSend(G.flags.pendingUncle?pick(["uy","un"]):pick(["safe","code","cheer","hide"]));
    let c=null;
    if(smart){ const sc=UI.scene;
     if(sc==="menu"){ const f=k=>cs.find(x=>x.k===k); const t=cs.filter(x=>x.k==="travel"); const sco=x=>-x.meta.fwd*200+x.meta.min+(x.meta.gang?70:0)+(x.meta.fire?50:0)+(x.meta.e.blocked>0?40:0)+(x.meta.drop?250:0)+(x.meta.runOut?60:0)+Math.random()*10;
      c=(((G.bleed>0||G.hp<G.hpMax*.5)&&(G.inv.includes("ชุดปฐมพยาบาล")||G.bleed>0))?f("heal"):null)||(((VEHS[G.veh].sp<20&&kmLeft()>(720-G.min)/60*4)||(VEHS[G.veh].fuel&&G.fuel<12))?(f("hotwire")||f("siphon")||f("search")):null)||(t.filter(x=>x.meta.fwd>0&&!x.dis).length?t.filter(x=>!x.dis).sort((a,b)=>sco(a)-sco(b))[0]:null)||(()=>{ const sp=cs.filter(x=>x.k==="spot"); const g=sp.filter(x=>x.meta.fwd); const vis=G._botSp=G._botSp||{}; const cand=(g.length?g:sp).filter(x=>(vis[G.at+":"+x.meta.id]||0)<3); const pk=cand.length?pick(cand):null; if(pk){vis[G.at+":"+pk.meta.id]=(vis[G.at+":"+pk.meta.id]||0)+1; return pk;} return t.filter(x=>!x.dis).sort((a,b)=>sco(a)-sco(b))[0]||f("hotwire")||cs[0]; })(); }
     else if(sc==="more"||sc==="mapview"||sc==="help"||sc==="cmore"){ c=cs.find(x=>x.k==="back")||cs[0]; if(sc==="more"&&G.stamina<22&&!G._bh){G._bh=1;c=cs.find(x=>x.k==="hide")||c;} }
     else if(sc==="combat"){ const f=k=>cs.find(x=>x.k===k), a=f("attack"), fl=f("flee"); c=(G.hp<G.hpMax*.3&&fl&&fl.p>.3)?fl:(a&&a.p>=.35)?a:f("close")||a||f("defend"); }
     else { const safe=cs.filter(x=>x.k!=="back"&&x.k!=="end"&&x.k!=="betray"&&x.k!=="rush"); const pool=safe.length?safe:cs; c=pool.slice().sort((a,b)=>((b.p==null?.6:b.p)+Math.random()*.25+(b.k==="fight"?-.3:0)+(b.k==="careful"?.4:0))-((a.p==null?.6:a.p)+Math.random()*.25+(a.k==="fight"?-.3:0)+(a.k==="careful"?.4:0)))[0]; } }
    (c||pick(cs)).go(); }
   if(!G.over){ out.stuck++; out.err.push("loop:"+UI.scene+":"+G.min); } else { const k=G.ending.cat+":"+G.ending.i; out.ends[k]=(out.ends[k]||0)+1; if(G.ending.arrived)out.arr++; if(G.ending.alive)out.alive++; }
  }catch(e){ out.err.push(String(e&&e.stack||e).slice(0,300)); } }
 window.__BOT=false; return out; };
